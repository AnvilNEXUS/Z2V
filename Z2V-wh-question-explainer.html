<!DOCTYPE html>
<html lang="en" class="antialiased dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How to Play: Wh-Question Rally</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-display {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    }
    @keyframes slideIn {
      0% { opacity: 0; transform: translateX(20px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .animate-slide {
      animation: slideIn 300ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#FAF9F6] text-[#18181B] dark:bg-[#0B0D13] dark:text-[#F4F4F6] min-h-[100dvh] flex flex-col items-center justify-center p-4 sm:p-8 transition-colors duration-300">

  <!-- Progress Bar -->
  <div class="fixed top-0 left-0 right-0 h-1.5 bg-zinc-200 dark:bg-zinc-800 z-50">
    <div id="progressBar" class="h-full bg-indigo-500 transition-all duration-300 ease-out" style="width: 14%;"></div>
  </div>

  <!-- Theme Toggle -->
  <button id="themeToggleBtn" onclick="toggleTheme()" class="fixed top-4 right-4 p-2 rounded-xl bg-white dark:bg-[#151924] border border-zinc-200 dark:border-zinc-800 shadow-sm z-50 cursor-pointer hover:scale-105 transition-transform">
    <span class="dark:hidden text-amber-500 text-xl">☀️</span>
    <span class="hidden dark:inline text-zinc-300 text-xl">🌙</span>
  </button>

  <!-- Explainer Card Container -->
  <div class="w-full max-w-3xl bg-white dark:bg-[#151924] rounded-3xl shadow-xl border border-zinc-200/90 dark:border-zinc-800/90 flex flex-col overflow-hidden min-h-[500px]">
    
    <!-- Header -->
    <div class="px-6 py-4 border-b border-zinc-100 dark:border-zinc-800 flex items-center justify-between bg-zinc-50 dark:bg-[#131722]">
      <span class="font-extrabold text-indigo-600 dark:text-indigo-400 tracking-wide uppercase text-sm">Student Guide</span>
      <span id="stepCounter" class="text-sm font-bold text-zinc-400 tabular-nums">Step 1 of 7</span>
    </div>

    <!-- Dynamic Content Area -->
    <div id="slideContent" class="flex-1 p-6 sm:p-10 flex flex-col justify-center animate-slide">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Navigation Footer -->
    <div class="px-6 py-5 border-t border-zinc-100 dark:border-zinc-800 flex items-center justify-between bg-zinc-50 dark:bg-[#131722]">
      <button id="prevBtn" onclick="goPrev()" class="px-5 py-2.5 rounded-xl font-bold bg-zinc-200 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-300 dark:hover:bg-zinc-700 transition disabled:opacity-30 disabled:pointer-events-none cursor-pointer">
        ← Back
      </button>
      <button id="nextBtn" onclick="goNext()" class="px-6 py-2.5 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-500 transition shadow-md cursor-pointer flex items-center gap-2">
        <span>Next</span> →
      </button>
    </div>
  </div>

  <script>
    const steps = [
      {
        title: "👋 Welcome to Wh-Question Rally!",
        desc: "In this classroom game, you will work with a partner. You will practice asking and answering questions in English using <b>full sentences</b>.",
        visual: `<div class="text-[80px] text-center drop-shadow-md pb-4">🗣️💬</div>`
      },
      {
        title: "1️⃣ Look at the Big Sentence",
        desc: "First, your teacher will show a big sentence on the screen. Read it carefully and understand the story.",
        visual: `
          <div class="rounded-3xl bg-white dark:bg-[#131722] border-2 border-zinc-200 dark:border-zinc-700 p-6 text-center shadow-sm">
            <h1 class="font-display text-xl sm:text-3xl font-extrabold text-zinc-900 dark:text-white leading-tight">
              My father flew to Hanoi by plane last week for a business trip.
            </h1>
          </div>
        `
      },
      {
        title: "2️⃣ Pick a Question Word",
        desc: "Next, a question word is selected on the board. There are 6 words you can play with!",
        visual: `
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
             <div class="rounded-xl px-2 py-3 border-2 border-blue-500 bg-blue-500/10 text-blue-600 font-extrabold text-center">WHO</div>
             <div class="rounded-xl px-2 py-3 border-2 border-emerald-500 bg-emerald-500/10 text-emerald-600 font-extrabold text-center">WHAT</div>
             <div class="rounded-xl px-2 py-3 border-2 border-amber-500 bg-amber-500 text-zinc-900 shadow-lg scale-105 font-extrabold text-center transform transition">WHERE</div>
             <div class="rounded-xl px-2 py-3 border-2 border-violet-500 bg-violet-500/10 text-violet-600 font-extrabold text-center">WHEN</div>
             <div class="rounded-xl px-2 py-3 border-2 border-rose-500 bg-rose-500/10 text-rose-600 font-extrabold text-center">WHY</div>
             <div class="rounded-xl px-2 py-3 border-2 border-cyan-500 bg-cyan-500/10 text-cyan-600 font-extrabold text-center">HOW</div>
          </div>
        `
      },
      {
        title: "3️⃣ Student A: Ask a Question!",
        desc: "Student A looks at the word (like <b>WHERE</b>). You must make a question. <br><span class='text-rose-500 dark:text-rose-400'>Rule: Always speak in a full sentence!</span>",
        visual: `
          <div class="rounded-2xl bg-zinc-100 dark:bg-[#1A2030] border-2 border-zinc-300 dark:border-zinc-700 p-5 relative">
            <span class="absolute -top-3 left-4 px-2 py-0.5 rounded bg-amber-500 text-xs font-bold text-zinc-900 uppercase">Student A Speaks</span>
            <div class="flex items-center gap-4 mt-2">
               <span class="text-4xl">🙋🏽‍♂️</span>
               <p class="font-display text-xl sm:text-2xl font-extrabold text-indigo-600 dark:text-indigo-400">"Where did he fly?"</p>
            </div>
          </div>
        `
      },
      {
        title: "4️⃣ Student B: Answer the Question!",
        desc: "Student B listens to Student A and answers the question. <br><span class='text-rose-500 dark:text-rose-400'>Rule: Don't just say \"To Hanoi\". Use a full sentence!</span>",
        visual: `
          <div class="rounded-2xl bg-amber-50 dark:bg-[#2B2313] border-2 border-amber-400 dark:border-amber-700 p-5 relative">
            <span class="absolute -top-3 right-4 px-2 py-0.5 rounded bg-indigo-500 text-white text-xs font-bold uppercase">Student B Speaks</span>
            <div class="flex flex-row-reverse items-center gap-4 mt-2">
               <span class="text-4xl">🙋🏻‍♀️</span>
               <p class="font-display text-xl sm:text-2xl font-extrabold text-amber-700 dark:text-amber-500 text-right">"He flew to Hanoi."</p>
            </div>
          </div>
        `
      },
      {
        title: "5️⃣ Memory Challenge! 🧠",
        desc: "Sometimes, the teacher will blur the big sentence. You must remember the facts to ask and answer correctly! You earn points for your team.",
        visual: `
           <div class="relative rounded-3xl bg-white dark:bg-[#131722] border-2 border-zinc-200 dark:border-zinc-700 p-6 text-center shadow-sm">
            <h1 class="font-display text-xl sm:text-3xl font-extrabold text-zinc-900 dark:text-white leading-tight blur-md opacity-30 select-none">
              My father flew to Hanoi by plane last week for a business trip.
            </h1>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="px-5 py-2.5 bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 font-extrabold rounded-2xl shadow-xl">👀 Memory Mode</span>
            </div>
          </div>
        `
      },
      {
        title: "🎉 You are ready!",
        desc: "Remember to listen to your partner, use full sentences, and have fun!",
        visual: `
          <div class="flex justify-center py-6">
            <button onclick="goNext()" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-extrabold text-xl shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer">
              Let's Start the Game!
            </button>
          </div>
        `
      }
    ];

    let currentStep = 0;
    const contentEl = document.getElementById("slideContent");
    const progressEl = document.getElementById("progressBar");
    const counterEl = document.getElementById("stepCounter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function renderStep() {
      // Retrigger animation
      contentEl.classList.remove("animate-slide");
      void contentEl.offsetWidth; // Trigger reflow
      contentEl.classList.add("animate-slide");

      const step = steps[currentStep];
      
      contentEl.innerHTML = `
        <h2 class="text-2xl sm:text-3xl font-extrabold text-zinc-900 dark:text-white mb-3 font-display tracking-tight">${step.title}</h2>
        <p class="text-base sm:text-lg text-zinc-600 dark:text-zinc-400 mb-8 leading-relaxed">${step.desc}</p>
        <div class="w-full flex-1 flex flex-col justify-center">
          ${step.visual}
        </div>
      `;

      // Update UI elements using correct template literals
      counterEl.textContent = `Step ${currentStep + 1} of ${steps.length}`;
      progressEl.style.width = `${((currentStep + 1) / steps.length) * 100}%`;
      
      prevBtn.disabled = currentStep === 0;
      
      if (currentStep === steps.length - 1) {
        nextBtn.innerHTML = "Finish 🎉";
        nextBtn.classList.replace("bg-indigo-600", "bg-emerald-600");
        nextBtn.classList.replace("hover:bg-indigo-500", "hover:bg-emerald-500");
      } else {
        nextBtn.innerHTML = "<span>Next</span> →";
        nextBtn.classList.replace("bg-emerald-600", "bg-indigo-600");
        nextBtn.classList.replace("hover:bg-emerald-500", "hover:bg-indigo-500");
      }
    }

    function goNext() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        renderStep();
      } else {
        // If finished, restart or show a complete state
        currentStep = 0;
        renderStep();
      }
    }

    function goPrev() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle("dark");
    }

    // Initialize the first step
    renderStep();
  </script>
</body>
</html>
