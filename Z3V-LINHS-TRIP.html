<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linh's Trip to Her Hometown — Comprehension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* =========================================
       Design Tokens & Theme Variables
       ========================================= */
    :root {
      --text-scale: 1.15;

      /* Light Mode (Warm Ivory & Refined Slate) */
      --bg-page: #f7f6f2;
      --bg-surface: #ffffff;
      --bg-surface-hover: #fbfaf7;
      --bg-surface-muted: #f0eee8;
      --bg-topbar: rgba(247, 246, 242, 0.88);

      --text-primary: #18181b;
      --text-secondary: #52525b;
      --text-muted: #8a8a93;

      --border-subtle: #e5e3dc;
      --border-strong: #d4d1c7;

      --accent: #1e4d3b;
      --accent-soft: rgba(30, 77, 59, 0.09);
      --accent-text: #ffffff;

      --mark-bg: #fde68a;
      --mark-text: #18181b;
      --mark-ring: rgba(217, 119, 6, 0.25);

      --shadow-card: 0 2px 10px rgba(24, 24, 27, 0.03), 0 1px 2px rgba(24, 24, 27, 0.04);
      --shadow-card-hover: 0 8px 24px rgba(24, 24, 27, 0.06), 0 2px 6px rgba(24, 24, 27, 0.04);

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --transition-theme: 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="dark"] {
      /* Dark Mode (Rich Deep Charcoal & Slate) */
      --bg-page: #111214;
      --bg-surface: #1a1c1f;
      --bg-surface-hover: #212428;
      --bg-surface-muted: #24272c;
      --bg-topbar: rgba(17, 18, 20, 0.88);

      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;

      --border-subtle: #272a30;
      --border-strong: #373b44;

      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.14);
      --accent-text: #0b1411;

      --mark-bg: rgba(251, 191, 36, 0.24);
      --mark-text: #fef3c7;
      --mark-ring: rgba(251, 191, 36, 0.42);

      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.24);
      --shadow-card-hover: 0 10px 28px rgba(0, 0, 0, 0.36);
    }

    /* =========================================
       Base Reset & Layout
       ========================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      transition: background-color var(--transition-theme), color var(--transition-theme);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================
       Minimal Top Navigation Bar
       ========================================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--bg-topbar);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      transition: background-color var(--transition-theme), border-color var(--transition-theme);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Paragraph Navigation Buttons */
    .para-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .para-btn {
      position: relative;
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 7px 11px 9px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, transform 120ms ease;
    }

    .para-btn:hover {
      background-color: var(--bg-surface-muted);
      color: var(--text-primary);
    }

    .para-btn:active {
      transform: scale(0.96);
    }

    .para-btn.active {
      background-color: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .para-dots {
      display: flex;
      gap: 3px;
      height: 4px;
      align-items: center;
    }

    .para-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--border-strong);
      opacity: 0.45;
      transition: background-color 180ms ease, opacity 180ms ease, transform 180ms ease;
    }

    .para-btn.active .para-dot {
      opacity: 0.35;
      background-color: var(--accent);
    }

    .para-btn.active .para-dot.filled {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Right Controls: Counter, Font Slider, Theme Toggle */
    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-left: auto;
    }

    .q-counter {
      font-size: 0.9rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 12px;
      background-color: var(--bg-surface-muted);
      border-radius: 999px;
      transition: background-color var(--transition-theme);
    }

    .slider-label-sm {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      user-select: none;
    }

    .slider-label-lg {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-primary);
      user-select: none;
    }

    .font-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 96px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-strong);
      outline: none;
      cursor: pointer;
    }

    .font-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-surface);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 140ms ease;
    }

    .font-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .font-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-surface);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .theme-btn {
      appearance: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 180ms ease, border-color 180ms ease, transform 140ms ease;
    }

    .theme-btn:hover {
      background-color: var(--bg-surface-muted);
      border-color: var(--border-strong);
    }

    .theme-btn:active {
      transform: scale(0.94);
    }

    .theme-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================================
       Main Stage (Centered, Spacious)
       ========================================= */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 36px 24px 48px;
      width: 100%;
    }

    .stage-inner {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      animation: fadeSlideIn 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Question Display */
    .question-block {
      padding: 8px 4px 12px;
      text-align: left;
    }

    .question-text {
      font-size: calc(2rem * var(--text-scale));
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      transition: font-size 80ms linear, color var(--transition-theme);
    }

    /* Interactive Reveal Cards */
    .reveal-card {
      width: 100%;
      text-align: left;
      appearance: none;
      font-family: inherit;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition:
        background-color var(--transition-theme),
        border-color 180ms ease,
        box-shadow 200ms ease,
        transform 140ms ease;
      position: relative;
      overflow: hidden;
    }

    .reveal-card:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-card-hover);
    }

    .reveal-card:active {
      transform: scale(0.996);
    }

    .reveal-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Answer Card */
    .answer-card {
      padding: 26px 32px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Larger Context Card */
    .context-card {
      padding: 36px 38px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Hidden / Cover State */
    .card-cover {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      user-select: none;
      transition: color 180ms ease;
    }

    .reveal-card:hover .card-cover {
      color: var(--text-primary);
    }

    .card-cover svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Revealed Content State */
    .card-content {
      display: none;
      animation: revealFade 200ms ease-out;
    }

    @keyframes revealFade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal-card.is-revealed .card-cover {
      display: none;
    }

    .reveal-card.is-revealed .card-content {
      display: block;
    }

    .reveal-card.is-revealed {
      border-color: var(--border-strong);
    }

    .answer-text {
      font-size: calc(1.45rem * var(--text-scale));
      font-weight: 600;
      line-height: 1.4;
      color: var(--accent);
      transition: font-size 80ms linear, color var(--transition-theme);
    }

    .context-text {
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-size: calc(1.38rem * var(--text-scale));
      font-weight: 400;
      line-height: 1.65;
      color: var(--text-primary);
      transition: font-size 80ms linear, color var(--transition-theme);
    }

    .context-text mark {
      background-color: var(--mark-bg);
      color: var(--mark-text);
      padding: 0.08em 0.24em;
      border-radius: 6px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      box-shadow: 0 0 0 1px var(--mark-ring);
      transition: background-color var(--transition-theme), color var(--transition-theme);
    }

    /* =========================================
       Subtle Bottom Prev / Next Controls
       ========================================= */
    .nav-footer {
      width: 100%;
      max-width: 960px;
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-btn {
      appearance: none;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: background-color 180ms ease, border-color 180ms ease, transform 120ms ease, opacity 180ms ease;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: var(--bg-surface-muted);
      border-color: var(--border-strong);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================================
       Responsive Adjustments
       ========================================= */
    @media (max-width: 720px) {
      .topbar-inner {
        padding: 10px 14px;
        gap: 10px;
      }

      .para-nav {
        width: 100%;
        justify-content: space-between;
        gap: 4px;
      }

      .para-btn {
        flex: 1;
        padding: 6px 4px 8px;
        font-size: 0.78rem;
      }

      .topbar-controls {
        width: 100%;
        justify-content: space-between;
      }

      .stage {
        padding: 24px 16px 36px;
      }

      .answer-card {
        padding: 20px 22px;
        min-height: 82px;
      }

      .context-card {
        padding: 24px 22px;
        min-height: 180px;
      }

      .nav-btn {
        padding: 11px 18px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- Minimal Top Navigation Bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <nav class="para-nav" id="paraNav" aria-label="Paragraph Navigation"></nav>

      <div class="topbar-controls">
        <div class="q-counter" id="qCounter" aria-live="polite">1 / 32</div>

        <div class="slider-group" title="Adjust text size">
          <span class="slider-label-sm" aria-hidden="true">A</span>
          <input
            type="range"
            id="fontSlider"
            class="font-slider"
            min="0.85"
            max="1.8"
            step="0.05"
            value="1.15"
            aria-label="Text size"
          />
          <span class="slider-label-lg" aria-hidden="true">A</span>
        </div>

        <button
          type="button"
          id="themeToggle"
          class="theme-btn"
          aria-label="Toggle dark mode"
          title="Toggle light/dark mode"
        >
          <!-- Moon icon (shown in light mode) -->
          <svg id="iconMoon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <!-- Sun icon (shown in dark mode) -->
          <svg id="iconSun" viewBox="0 0 24 24" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Single-Question Stage -->
  <main class="stage">
    <div class="stage-inner" id="stageInner">
      <!-- Question Display -->
      <section class="question-block">
        <h1 class="question-text" id="questionText"></h1>
      </section>

      <!-- Answer Card -->
      <button
        type="button"
        class="reveal-card answer-card"
        id="answerCard"
        aria-expanded="false"
      >
        <span class="card-cover">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          Answer
        </span>
        <div class="card-content">
          <p class="answer-text" id="answerText"></p>
        </div>
      </button>

      <!-- Larger Story Context Card -->
      <button
        type="button"
        class="reveal-card context-card"
        id="contextCard"
        aria-expanded="false"
      >
        <span class="card-cover">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          Story Context
        </span>
        <div class="card-content">
          <p class="context-text" id="contextText"></p>
        </div>
      </button>
    </div>

    <!-- Subtle Previous / Next Controls -->
    <div class="nav-footer">
      <button type="button" class="nav-btn" id="prevBtn" aria-label="Previous question">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Previous
      </button>

      <button type="button" class="nav-btn" id="nextBtn" aria-label="Next question">
        Next
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </main>

  <script>
    /* =========================================
       Story Paragraphs (8 Paragraphs)
       ========================================= */
    const PARAGRAPHS = [
      "Early on Saturday morning, thirteen-year-old Linh woke up in her noisy apartment in Ho Chi Minh City. She put her clothes into a blue backpack and got on a big bus with her parents. They were going to visit her grandparents in her mother's hometown in the countryside. Linh loved her grandparents, but she felt a little worried about the trip. She knew the small village had very slow Wi-Fi, and she was afraid she would feel bored without her city friends.",
      "After two hours on the road, the tall buildings and busy motorbikes disappeared. Outside the bus window, Linh saw bright green rice fields and hundreds of tall coconut trees. When the bus finally stopped near a small bridge, her grandmother and grandfather were already waiting there with big smiles. Linh stepped off the bus and took a deep breath. The country air smelled fresh, clean, and completely different from the busy city.",
      "They walked down a quiet dirt path to her grandparents' old house beside a wide brown river. Behind the house, there was a wonderful garden full of mango trees, banana plants, and bright yellow flowers. Before Linh could even open the wooden gate, a small brown dog named Muc ran out to greet her. He wagged his tail and jumped happily around her sneakers, making Linh laugh for the first time that day.",
      "After a warm lunch, Linh's twelve-year-old cousin, Nam, arrived on an old bicycle. \"Come on, Linh! Let's explore the village,\" he shouted with a huge grin. Linh grabbed another bicycle from the yard and followed him down the narrow path next to the river. At first, she reached into her pocket to check her phone, but there was no internet at all. She smiled, put the phone away, and rode faster to catch up with Nam.",
      "They rode past small wooden boats on the water and friendly neighbors who waved hello from their gardens. Soon, Nam stopped at a tiny roadside shop and bought two cold glasses of sweet sugarcane juice. They sat together under a giant shady tree and drank slowly while the warm wind blew through the leaves. Below them, a line of white ducks swam across the river, and Linh forgot all about her busy life in the city.",
      "When they returned to the house, the evening sky was turning bright orange and pink. Linh went into the outside kitchen to help her grandmother wash fresh green vegetables and cook sour fish soup. The delicious smell of garlic and hot white rice soon filled the whole yard. When the food was ready, the entire family sat together on a large mat on the floor, sharing stories and laughing over dinner.",
      "After dinner, Linh sat on a wooden bench outside with her grandfather to enjoy the cool night air. Because there were no bright streetlamps or tall buildings nearby, the dark sky was full of hundreds of shining stars. She listened to the peaceful sound of frogs singing near the river and insects humming in the grass. For the first time in months, Linh felt completely calm, and she noticed she had not looked at her phone all afternoon.",
      "On Sunday afternoon, it was time to pack her backpack and catch the bus back to Ho Chi Minh City. Before they left, her grandmother handed Linh a heavy bag of sweet yellow mangoes and homemade coconut candy for her classmates. Linh gave her grandparents and Nam big hugs, and she even patted Muc on the head to say goodbye. As the bus drove away from the little bridge, Linh looked out the window with a happy smile and started planning her next trip back home."
    ];

    /* =========================================
       32 Comprehension Questions (4 per Paragraph)
       ========================================= */
    const QUESTIONS = [
      // Paragraph 1
      { p: 0, q: "Where did Linh live?", a: "In a noisy apartment in Ho Chi Minh City.", highlight: "her noisy apartment in Ho Chi Minh City" },
      { p: 0, q: "How did Linh and her parents travel to the countryside?", a: "They took a big bus.", highlight: "got on a big bus with her parents" },
      { p: 0, q: "Who were they going to visit?", a: "Her grandparents in her mother's hometown.", highlight: "visit her grandparents in her mother's hometown" },
      { p: 0, q: "Why was Linh worried about the trip?", a: "The small village had very slow Wi-Fi, and she was afraid she would feel bored without her city friends.", highlight: "the small village had very slow Wi-Fi, and she was afraid she would feel bored without her city friends" },

      // Paragraph 2
      { p: 1, q: "How long did the bus ride take?", a: "Two hours.", highlight: "After two hours on the road" },
      { p: 1, q: "What did Linh see outside the bus window?", a: "Bright green rice fields and hundreds of tall coconut trees.", highlight: "bright green rice fields and hundreds of tall coconut trees" },
      { p: 1, q: "Where did the bus stop?", a: "Near a small bridge.", highlight: "near a small bridge" },
      { p: 1, q: "How did the country air smell?", a: "Fresh, clean, and completely different from the busy city.", highlight: "fresh, clean, and completely different from the busy city" },

      // Paragraph 3
      { p: 2, q: "Where was her grandparents' old house located?", a: "Down a quiet dirt path beside a wide brown river.", highlight: "down a quiet dirt path to her grandparents' old house beside a wide brown river" },
      { p: 2, q: "What was in the garden behind the house?", a: "Mango trees, banana plants, and bright yellow flowers.", highlight: "mango trees, banana plants, and bright yellow flowers" },

      { p: 4, q: "What swam across the river below them?", a: "A line of white ducks.", highlight: "a line of white ducks swam across the river" },

      // Paragraph 6
      { p: 5, q: "What colors was the evening sky when they returned?", a: "Bright orange and pink.", highlight: "bright orange and pink" },
      { p: 5, q: "How did Linh help her grandmother in the outside kitchen?", a: "She helped wash fresh green vegetables and cook sour fish soup.", highlight: "wash fresh green vegetables and cook sour fish soup" },
      { p: 5, q: "What delicious smells filled the whole yard?", a: "Garlic and hot white rice.", highlight: "garlic and hot white rice" },
      { p: 5, q: "Where did the family sit to eat dinner?", a: "Together on a large mat on the floor.", highlight: "on a large mat on the floor" },

      // Paragraph 7
      { p: 6, q: "Who did Linh sit with on the wooden bench after dinner?", a: "Her grandfather.", highlight: "with her grandfather" },
      { p: 6, q: "Why was the dark sky full of hundreds of shining stars?", a: "Because there were no bright streetlamps or tall buildings nearby.", highlight: "Because there were no bright streetlamps or tall buildings nearby" },
      { p: 6, q: "What peaceful night sounds did Linh listen to?", a: "Frogs singing near the river and insects humming in the grass.", highlight: "frogs singing near the river and insects humming in the grass" },

      { p: 7, q: "What did Linh start doing as the bus drove away?", a: "She started planning her next trip back home.", highlight: "started planning her next trip back home" }
    ];

    /* =========================================
       App State & DOM References
       ========================================= */
    let currentIndex = 0;

    const paraNav = document.getElementById("paraNav");
    const qCounter = document.getElementById("qCounter");
    const fontSlider = document.getElementById("fontSlider");
    const themeToggle = document.getElementById("themeToggle");
    const iconMoon = document.getElementById("iconMoon");
    const iconSun = document.getElementById("iconSun");

    const stageInner = document.getElementById("stageInner");
    const questionText = document.getElementById("questionText");
    const answerCard = document.getElementById("answerCard");
    const answerText = document.getElementById("answerText");
    const contextCard = document.getElementById("contextCard");
    const contextText = document.getElementById("contextText");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    /* =========================================
       Helpers
       ========================================= */
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function buildHighlightedParagraph(paragraph, highlight) {
      const idx = paragraph.indexOf(highlight);
      if (idx === -1) {
        return escapeHTML(paragraph);
      }
      const before = escapeHTML(paragraph.slice(0, idx));
      const match = escapeHTML(paragraph.slice(idx, idx + highlight.length));
      const after = escapeHTML(paragraph.slice(idx + highlight.length));
      return `${before}<mark>${match}</mark>${after}`;
    }

    /* =========================================
       Build Paragraph Navigation (P1 - P8)
       ========================================= */
    function initParagraphNav() {
      paraNav.innerHTML = "";
      for (let i = 0; i < 8; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "para-btn";
        btn.dataset.para = i;
        btn.setAttribute("aria-label", `Paragraph ${i + 1}`);

        const label = document.createElement("span");
        label.textContent = `P${i + 1}`;

        const dots = document.createElement("span");
        dots.className = "para-dots";
        dots.setAttribute("aria-hidden", "true");
        for (let d = 0; d < 4; d++) {
          const dot = document.createElement("span");
          dot.className = "para-dot";
          dots.appendChild(dot);
        }

        btn.appendChild(label);
        btn.appendChild(dots);

        btn.addEventListener("click", () => {
          goToQuestion(i * 4);
        });

        paraNav.appendChild(btn);
      }
    }

    function updateParagraphNav() {
      const activePara = QUESTIONS[currentIndex].p;
      const posInPara = currentIndex % 4; // 0, 1, 2, or 3

      const buttons = paraNav.querySelectorAll(".para-btn");
      buttons.forEach((btn, idx) => {
        const isActive = idx === activePara;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-current", isActive ? "true" : "false");

        const dots = btn.querySelectorAll(".para-dot");
        dots.forEach((dot, dIdx) => {
          dot.classList.toggle("filled", isActive && dIdx <= posInPara);
        });
      });
    }

    /* =========================================
       Render Active Question
       ========================================= */
    function resetCards() {
      answerCard.classList.remove("is-revealed");
      answerCard.setAttribute("aria-expanded", "false");
      contextCard.classList.remove("is-revealed");
      contextCard.setAttribute("aria-expanded", "false");
    }

    function renderQuestion() {
      const item = QUESTIONS[currentIndex];
      const paragraph = PARAGRAPHS[item.p];

      // Reset cards to hidden state
      resetCards();

      // Update text content
      questionText.textContent = item.q;
      answerText.textContent = item.a;
      contextText.innerHTML = buildHighlightedParagraph(paragraph, item.highlight);

      // Update counter & nav
      qCounter.textContent = `${currentIndex + 1} / ${QUESTIONS.length}`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === QUESTIONS.length - 1;
      updateParagraphNav();

      // Subtle re-trigger of entrance animation
      stageInner.style.animation = "none";
      void stageInner.offsetWidth;
      stageInner.style.animation = "";
    }

    function goToQuestion(index) {
      if (index < 0 || index >= QUESTIONS.length) return;
      currentIndex = index;
      renderQuestion();
    }

    /* =========================================
       Event Listeners
       ========================================= */
    // Toggle Answer Card
    answerCard.addEventListener("click", () => {
      const revealed = answerCard.classList.toggle("is-revealed");
      answerCard.setAttribute("aria-expanded", String(revealed));
    });

    // Toggle Context Card
    contextCard.addEventListener("click", () => {
      const revealed = contextCard.classList.toggle("is-revealed");
      contextCard.setAttribute("aria-expanded", String(revealed));
    });

    // Previous / Next Buttons
    prevBtn.addEventListener("click", () => goToQuestion(currentIndex - 1));
    nextBtn.addEventListener("click", () => goToQuestion(currentIndex + 1));

    // Keyboard Arrow Navigation
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowRight") {
        goToQuestion(currentIndex + 1);
      } else if (e.key === "ArrowLeft") {
        goToQuestion(currentIndex - 1);
      }
    });

    // Dynamic Font-Size Slider
    fontSlider.addEventListener("input", (e) => {
      document.documentElement.style.setProperty("--text-scale", e.target.value);
    });

    // Light / Dark Mode Toggle
    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const isDark = theme === "dark";
      iconMoon.style.display = isDark ? "none" : "block";
      iconSun.style.display = isDark ? "block" : "none";
      themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      setTheme(current === "dark" ? "light" : "dark");
    });

    // Initialize
    initParagraphNav();
    renderQuestion();
  </script>
</body>
</html>
