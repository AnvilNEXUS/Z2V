          { wh: "WHERE", question: "Where did he call from?", answer: "From a cafe." },
          { wh: "WHEN", question: "When did he call?", answer: "After school." },
          { wh: "WHY", question: "Why did he call his best friend?", answer: "To ask about the homework." },
          { wh: "HOW", question: "How did he call?", answer: "On his mobile phone." }
        ]
      },
      {
        category: "Free Time & Daily Life",
        sentence: "We cleaned the windows in the living room with soap and water on Saturday morning because our guests were arriving.",
        items: [
          { wh: "WHO", question: "Who cleaned the windows?", answer: "We did." },
          { wh: "WHAT", question: "What did you clean?", answer: "The windows." },
          { wh: "WHERE", question: "Where did you clean the windows?", answer: "In the living room." },
          { wh: "WHEN", question: "When did you clean them?", answer: "On Saturday morning." },
          { wh: "WHY", question: "Why did you clean the windows?", answer: "Because our guests were arriving." },
          { wh: "HOW", question: "How did you clean them?", answer: "With soap and water." }
        ]
      }
    ];

    // Color-coded pill styling for each Wh-word across Light and Dark modes
    const WH_BADGE_STYLES = {
      WHO:   "bg-blue-50 text-blue-700 border-blue-200/80 dark:bg-blue-500/15 dark:text-blue-300 dark:border-blue-500/25",
      WHAT:  "bg-emerald-50 text-emerald-700 border-emerald-200/80 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/25",
      WHERE: "bg-amber-50 text-amber-700 border-amber-200/80 dark:bg-amber-500/15 dark:text-amber-300 dark:border-amber-500/25",
      WHEN:  "bg-violet-50 text-violet-700 border-violet-200/80 dark:bg-violet-500/15 dark:text-violet-300 dark:border-violet-500/25",
      WHY:   "bg-rose-50 text-rose-700 border-rose-200/80 dark:bg-rose-500/15 dark:text-rose-300 dark:border-rose-500/25",
      HOW:   "bg-cyan-50 text-cyan-700 border-cyan-200/80 dark:bg-cyan-500/15 dark:text-cyan-300 dark:border-cyan-500/25"
    };

    // Application State
    // All 6 cards start concealed by default on every slide (empty Set = none revealed)
    let currentIndex = 0;
    let revealedCards = new Set();
    let isTransitioning = false;

    // Safe localStorage helpers (handles sandboxed iframe environments gracefully)
    function getStoredTheme() {
      try {
        return localStorage.getItem("a2_wh_theme");
      } catch (e) {
        return null;
      }
    }

    function setStoredTheme(theme) {
      try {
        localStorage.setItem("a2_wh_theme", theme);
      } catch (e) {
        // Ignore storage restrictions
      }
    }

    // Apply Light or Dark theme
    function applyTheme(isDark) {
      const root = document.documentElement;
      const sunIcon = document.getElementById("sunIcon");
      const moonIcon = document.getElementById("moonIcon");

      if (isDark) {
        root.classList.add("dark");
        sunIcon.classList.remove("hidden");
        moonIcon.classList.add("hidden");
      } else {
        root.classList.remove("dark");
        sunIcon.classList.add("hidden");
        moonIcon.classList.remove("hidden");
      }
    }

    // Initialize theme on startup
    function initTheme() {
      const saved = getStoredTheme();
      if (saved === "dark") {
        applyTheme(true);
      } else if (saved === "light") {
        applyTheme(false);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(prefersDark);
      }
    }

    // Synchronize the header "Reveal All" / "Hide All" button state with revealedCards
    function updateToggleAllUI() {
      const btn = document.getElementById("toggleAllBtn");
      const eyeOpen = document.getElementById("eyeOpenIcon");
      const eyeClosed = document.getElementById("eyeClosedIcon");
      const label = document.getElementById("toggleAllLabel");
      const totalCards = SLIDES[currentIndex].items.length;
      const allRevealed = revealedCards.size === totalCards;

      btn.setAttribute("aria-pressed", String(allRevealed));
      if (allRevealed) {
        eyeOpen.classList.add("hidden");
        eyeClosed.classList.remove("hidden");
        label.textContent = "Hide All";
      } else {
        eyeOpen.classList.remove("hidden");
        eyeClosed.classList.add("hidden");
        label.textContent = "Reveal All";
      }
    }

    // Toggle an individual Wh-card between concealed and revealed
    function toggleCardAtIndex(idx, shouldAnimate = true) {
      if (revealedCards.has(idx)) {
        revealedCards.delete(idx);
      } else {
        revealedCards.add(idx);
      }
      renderCards(shouldAnimate ? idx : -1);
      updateToggleAllUI();
    }

    // Render the 6 Wh-cards for the active slide
    // animateIndex indicates which card just transitioned to revealed for subtle fade-in
    function renderCards(animateIndex = -1) {
      const slide = SLIDES[currentIndex];
      const grid = document.getElementById("whGrid");
      grid.innerHTML = "";

      slide.items.forEach((item, idx) => {
        const isRevealed = revealedCards.has(idx);
        const badgeStyle = WH_BADGE_STYLES[item.wh] || "";

        const card = document.createElement("div");
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-expanded", String(isRevealed));
        card.setAttribute(
          "aria-label",
          isRevealed
            ? `${item.wh}: Question: ${item.question} Answer: ${item.answer}. Click to conceal.`
            : `${item.wh} card concealed. Click to reveal question and answer.`
        );

        card.className = [
          "group rounded-xl p-3.5 sm:p-4 lg:p-[18px] min-h-[106px] sm:min-h-[114px]",
          "bg-white dark:bg-[#161922]",
          isRevealed
            ? "border border-[#D4D4D8] dark:border-[#323848]"
            : "border border-[#E4E4E7] dark:border-[#262A36] hover:border-zinc-300 dark:hover:border-zinc-600",
          "shadow-[0_1px_2px_rgba(0,0,0,0.03)] dark:shadow-none",
          "active:scale-[0.99] transition-all duration-200 flex flex-col justify-between cursor-pointer select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-400 dark:focus-visible:ring-zinc-500"
        ].join(" ");

        // Handle click and keyboard activation (Enter / Space) on individual cards
        card.addEventListener("click", () => toggleCardAtIndex(idx, true));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            e.stopPropagation();
            toggleCardAtIndex(idx, true);
          }
        });

        // Top row: Color-coded Wh-word badge on left + subtle interactive hint on right
        const topRow = document.createElement("div");
        topRow.className = "flex items-center justify-between gap-2 mb-2.5";

        const pill = document.createElement("span");
        pill.className = `inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold tracking-wider border ${badgeStyle}`;
        pill.textContent = item.wh;
        topRow.appendChild(pill);

        const hint = document.createElement("span");
        if (!isRevealed) {
          hint.className = "text-[11px] font-medium text-zinc-400 dark:text-zinc-500 group-hover:text-zinc-600 dark:group-hover:text-zinc-300 transition-colors";
          hint.textContent = "Click to reveal";
        } else {
          hint.className = "text-[11px] font-medium text-zinc-400/80 dark:text-zinc-500/80 opacity-0 group-hover:opacity-100 group-focus-visible:opacity-100 transition-opacity";
          hint.textContent = "Click to hide";
        }
        topRow.appendChild(hint);

        card.appendChild(topRow);

        // Card Body: Concealed prompt vs. Revealed Question & Answer
        if (!isRevealed) {
          // Concealed state: uniform placeholder bar + classroom thinking prompt (no word-length leak)
          const concealedBody = document.createElement("div");
          concealedBody.className = "space-y-2 py-0.5";
          concealedBody.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center justify-center w-4 h-4 rounded text-[10px] font-semibold bg-zinc-100 dark:bg-zinc-800 text-zinc-400 dark:text-zinc-500 shrink-0">Q</span>
              <div class="h-2.5 w-3/4 rounded-full bg-zinc-100 dark:bg-zinc-800/90 group-hover:bg-zinc-200/70 dark:group-hover:bg-zinc-700/70 transition-colors"></div>
            </div>
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center justify-center w-4 h-4 rounded text-[10px] font-semibold bg-zinc-100 dark:bg-zinc-800 text-zinc-400 dark:text-zinc-500 shrink-0">A</span>
              <span class="text-xs sm:text-[13px] font-medium text-zinc-400 dark:text-zinc-500 group-hover:text-zinc-600 dark:group-hover:text-zinc-400 transition-colors">
                Think: Compose the question &amp; answer
              </span>
            </div>
          `;
          card.appendChild(concealedBody);
        } else {
          // Revealed state: clearly distinguished Question (Q) and Answer (A)
          const revealedBody = document.createElement("div");
          revealedBody.className = `space-y-1.5 select-text ${animateIndex === idx ? "animate-reveal" : ""}`;

          // Question row
          const qRow = document.createElement("div");
          qRow.className = "flex items-start gap-2";

          const qLabel = document.createElement("span");
          qLabel.className = "inline-flex items-center justify-center w-4 h-4 rounded text-[10px] font-bold bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400 shrink-0 mt-0.5 select-none";
          qLabel.textContent = "Q";

          const qText = document.createElement("p");
          qText.className = "text-sm sm:text-[15px] font-medium text-[#18181B] dark:text-[#F4F4F6] leading-snug";
          qText.textContent = item.question;

          qRow.appendChild(qLabel);
          qRow.appendChild(qText);

          // Answer row
          const aRow = document.createElement("div");
          aRow.className = "flex items-start gap-2";

          const aLabel = document.createElement("span");
          aLabel.className = "inline-flex items-center justify-center w-4 h-4 rounded text-[10px] font-bold bg-zinc-900/[0.06] dark:bg-white/[0.09] text-zinc-700 dark:text-zinc-200 shrink-0 mt-0.5 select-none";
          aLabel.textContent = "A";

          const aText = document.createElement("p");
          aText.className = "text-sm sm:text-[15px] font-bold text-zinc-700 dark:text-zinc-200 leading-snug";
          aText.textContent = item.answer;

          aRow.appendChild(aLabel);
          aRow.appendChild(aText);

          revealedBody.appendChild(qRow);
          revealedBody.appendChild(aRow);
          card.appendChild(revealedBody);
        }

        grid.appendChild(card);
      });
    }

    // Render current slide metadata, sentence, progress, and navigation states
    function renderSlide(direction = 0) {
      const slide = SLIDES[currentIndex];
      const total = SLIDES.length;
      const stage = document.getElementById("slideStage");

      const updateContent = () => {
        document.getElementById("categoryBadge").textContent = slide.category;
        document.getElementById("pageCounter").textContent = `${currentIndex + 1} / ${total}`;
        document.getElementById("sentenceText").textContent = slide.sentence;

        // Update thin top progress bar
        const pct = ((currentIndex + 1) / total) * 100;
        document.getElementById("progressBar").style.width = `${pct}%`;

        // Update Prev / Next buttons
        document.getElementById("prevBtn").disabled = currentIndex === 0;
        document.getElementById("nextBtn").disabled = currentIndex === total - 1;

        renderCards(-1);
        updateToggleAllUI();
      };

      // Subtle fade/slide transition when navigating between slides
      if (direction !== 0 && !isTransitioning) {
        isTransitioning = true;
        const offsetOut = direction > 0 ? "-10px" : "10px";
        const offsetIn = direction > 0 ? "10px" : "-10px";

        stage.style.opacity = "0";
        stage.style.transform = `translateX(${offsetOut})`;

        setTimeout(() => {
          updateContent();
          stage.style.transition = "none";
          stage.style.transform = `translateX(${offsetIn})`;

          // Force reflow
          void stage.offsetWidth;

          stage.style.transition = "opacity 220ms ease-out, transform 220ms ease-out";
          stage.style.opacity = "1";
          stage.style.transform = "translateX(0)";

          setTimeout(() => {
            isTransitioning = false;
          }, 220);
        }, 140);
      } else {
        updateContent();
      }
    }

    // Navigation handlers (reset all cards to concealed on slide change)
    function goToPrev() {
      if (currentIndex > 0) {
        currentIndex -= 1;
        revealedCards.clear();
        renderSlide(-1);
      }
    }

    function goToNext() {
      if (currentIndex < SLIDES.length - 1) {
        currentIndex += 1;
        revealedCards.clear();
        renderSlide(1);
      }
    }

    // Bind UI Event Listeners
    document.getElementById("prevBtn").addEventListener("click", goToPrev);
    document.getElementById("nextBtn").addEventListener("click", goToNext);

    // Header "Reveal All" / "Hide All" button
    document.getElementById("toggleAllBtn").addEventListener("click", () => {
      const totalCards = SLIDES[currentIndex].items.length;
      if (revealedCards.size === totalCards) {
        revealedCards.clear();
      } else {
        for (let i = 0; i < totalCards; i++) {
          revealedCards.add(i);
        }
      }
      renderCards(-1);
      updateToggleAllUI();
    });

    // Theme toggle button
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const isCurrentlyDark = document.documentElement.classList.contains("dark");
      const nextIsDark = !isCurrentlyDark;
      applyTheme(nextIsDark);
      setStoredTheme(nextIsDark ? "dark" : "light");
    });

    // Keyboard Navigation: ArrowLeft, ArrowRight, Space, and 1-6 card shortcuts
    document.addEventListener("keydown", (e) => {
      const activeTag = document.activeElement ? document.activeElement.tagName : "";
      const isInteractiveFocused = activeTag === "BUTTON" || document.activeElement?.getAttribute("role") === "button";

      if (e.key === "ArrowLeft") {
        e.preventDefault();
        goToPrev();
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        goToNext();
      } else if (e.key === " " && !isInteractiveFocused) {
        e.preventDefault();
        if (e.shiftKey) {
          goToPrev();
        } else {
          goToNext();
        }
      } else if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key >= "1" && e.key <= "6") {
        const cardIdx = parseInt(e.key, 10) - 1;
        if (cardIdx < SLIDES[currentIndex].items.length) {
          e.preventDefault();
          toggleCardAtIndex(cardIdx, true);
        }
      }
    });

    // Touch Swipe Support for Mobile & Tablet
    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;

        // Trigger slide change only on clear horizontal swipes
        if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
          if (deltaX < 0) {
            goToNext();
          } else {
            goToPrev();
          }
        }
      }
    }, { passive: true });

    // Bootstrap App
    initTheme();
    renderSlide(0);
  </script>
</body>
</html>
