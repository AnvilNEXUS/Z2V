<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linh's Trip to Her Hometown (A1) — Comprehension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* =========================================
       Design Tokens & Theme Variables
       ========================================= */
    :root {
      --text-scale: 1.15;

      /* Light Mode (Warm Ivory & Refined Slate) */
      --bg-page: #f7f6f2;
      --bg-surface: #ffffff;
      --bg-surface-hover: #fbfaf7;
      --bg-surface-muted: #f0eee8;
      --bg-topbar: rgba(247, 246, 242, 0.88);

      --text-primary: #18181b;
      --text-secondary: #52525b;
      --text-muted: #8a8a93;

      --border-subtle: #e5e3dc;
      --border-strong: #d4d1c7;

      --accent: #1e4d3b;
      --accent-soft: rgba(30, 77, 59, 0.09);
      --accent-text: #ffffff;

      --mark-bg: #fde68a;
      --mark-text: #18181b;
      --mark-ring: rgba(217, 119, 6, 0.25);

      --shadow-card: 0 2px 10px rgba(24, 24, 27, 0.03), 0 1px 2px rgba(24, 24, 27, 0.04);
      --shadow-card-hover: 0 8px 24px rgba(24, 24, 27, 0.06), 0 2px 6px rgba(24, 24, 27, 0.04);

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --transition-theme: 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="dark"] {
      /* Dark Mode (Rich Deep Charcoal & Slate) */
      --bg-page: #111214;
      --bg-surface: #1a1c1f;
      --bg-surface-hover: #212428;
      --bg-surface-muted: #24272c;
      --bg-topbar: rgba(17, 18, 20, 0.88);

      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;

      --border-subtle: #272a30;
      --border-strong: #373b44;

      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.14);
      --accent-text: #0b1411;

      --mark-bg: rgba(251, 191, 36, 0.24);
      --mark-text: #fef3c7;
      --mark-ring: rgba(251, 191, 36, 0.42);

      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.24);
      --shadow-card-hover: 0 10px 28px rgba(0, 0, 0, 0.36);
    }

    /* =========================================
       Base Reset & Layout
       ========================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      transition: background-color var(--transition-theme), color var(--transition-theme);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================
       Minimal Top Navigation Bar
       ========================================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--bg-topbar);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      transition: background-color var(--transition-theme), border-color var(--transition-theme);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Paragraph Navigation Buttons */
    .para-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .para-btn {
      position: relative;
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 7px 11px 9px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, transform 120ms ease;
    }

    .para-btn:hover {
      background-color: var(--bg-surface-muted);
      color: var(--text-primary);
    }

    .para-btn:active {
      transform: scale(0.96);
    }

    .para-btn.active {
      background-color: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .para-dots {
      display: flex;
      gap: 3px;
      height: 4px;
      align-items: center;
    }

    .para-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--border-strong);
      opacity: 0.45;
      transition: background-color 180ms ease, opacity 180ms ease, transform 180ms ease;
    }

    .para-btn.active .para-dot {
      opacity: 0.35;
      background-color: var(--accent);
    }

    .para-btn.active .para-dot.filled {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Right Controls: Counter, Font Slider, Theme Toggle */
    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-left: auto;
    }

    .q-counter {
      font-size: 0.9rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 12px;
      background-color: var(--bg-surface-muted);
      border-radius: 999px;
      transition: background-color var(--transition-theme);
    }

    .slider-label-sm {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      user-select: none;
    }

    .slider-label-lg {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-primary);
      user-select: none;
    }

    .font-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 96px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-strong);
      outline: none;
      cursor: pointer;
    }

    .font-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-surface);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 140ms ease;
    }

    .font-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .font-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-surface);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .theme-btn {
      appearance: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 180ms ease, border-color 180ms ease, transform 140ms ease;
    }

    .theme-btn:hover {
      background-color: var(--bg-surface-muted);
      border-color: var(--border-strong);
    }

    .theme-btn:active {
      transform: scale(0.94);
    }

    .theme-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================================
       Main Stage (Centered, Spacious)
       ========================================= */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 36px 24px 48px;
      width: 100%;
    }

    .stage-inner {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      animation: fadeSlideIn 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Question Display */
    .question-block {
      position: relative;
      padding: 8px 34px 12px 4px;
      text-align: left;
    }

    .question-text {
      font-size: calc(2rem * var(--text-scale));
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      transition: font-size 80ms linear, color var(--transition-theme);
    }

    /* Interactive Reveal Cards */
    .reveal-card {
      width: 100%;
      text-align: left;
      font-family: inherit;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition:
        background-color var(--transition-theme),
        border-color 180ms ease,
        box-shadow 200ms ease,
        transform 140ms ease;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .reveal-card.is-revealed {
      user-select: text;
    }

    .reveal-card:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-card-hover);
    }

    .reveal-card:active {
      transform: scale(0.996);
    }

    .reveal-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Answer Card */
    .answer-card {
      padding: 26px 32px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Larger Context Card */
    .context-card {
      padding: 36px 38px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Hidden / Cover State */
    .card-cover {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      user-select: none;
      transition: color 180ms ease;
    }

    .reveal-card:hover .card-cover {
      color: var(--text-primary);
    }

    .card-cover svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Revealed Content State */
    .card-content {
      display: none;
      padding-right: 22px;
      animation: revealFade 200ms ease-out;
    }

    @keyframes revealFade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal-card.is-revealed .card-cover {
      display: none;
    }

    .reveal-card.is-revealed .card-content {
      display: block;
    }

    .reveal-card.is-revealed {
      border-color: var(--border-strong);
    }

    .answer-text {
      font-size: calc(1.45rem * var(--text-scale));
      font-weight: 600;
      line-height: 1.4;
      color: var(--accent);
      transition: font-size 80ms linear, color var(--transition-theme);
    }

    .context-text {
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-size: calc(1.38rem * var(--text-scale));
      font-weight: 400;
      line-height: 1.65;
      color: var(--text-primary);
      transition: font-size 80ms linear, color var(--transition-theme);
    }

    .context-text mark {
      background-color: var(--mark-bg);
      color: var(--mark-text);
      padding: 0.08em 0.24em;
      border-radius: 6px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      box-shadow: 0 0 0 1px var(--mark-ring);
      transition: background-color var(--transition-theme), color var(--transition-theme);
    }

    /* =========================================
       Discreet Vietnamese Flag Toggle (Content Only)
       ========================================= */
    .lang-flag-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      width: 24px;
      height: 18px;
      padding: 3px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.16;
      filter: saturate(0.25);
      transition: opacity 180ms ease, filter 180ms ease, transform 140ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    .question-block .lang-flag-btn {
      top: 10px;
      right: 2px;
    }

    .reveal-card:not(.is-revealed) .lang-flag-btn {
      display: none;
    }

    .question-block:hover .lang-flag-btn,
    .reveal-card.is-revealed:hover .lang-flag-btn {
      opacity: 0.45;
      filter: saturate(0.8);
    }

    .lang-flag-btn:hover,
    .lang-flag-btn:focus-visible {
      opacity: 1 !important;
      filter: saturate(1) !important;
      background-color: var(--bg-surface-muted);
      border-color: var(--border-subtle);
      transform: scale(1.08);
      outline: none;
    }

    .lang-flag-btn:active {
      transform: scale(0.94);
    }

    .lang-flag-btn.is-vi {
      opacity: 0.92;
      filter: saturate(1);
      background-color: var(--accent-soft);
      border-color: var(--accent);
    }

    .lang-flag-btn svg {
      width: 15px;
      height: 10px;
      display: block;
      border-radius: 1.5px;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.14);
      pointer-events: none;
    }

    @media (hover: none) {
      .lang-flag-btn {
        opacity: 0.28;
        filter: saturate(0.5);
      }
    }

    /* =========================================
       Subtle Bottom Prev / Next Controls
       ========================================= */
    .nav-footer {
      width: 100%;
      max-width: 960px;
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-btn {
      appearance: none;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: background-color 180ms ease, border-color 180ms ease, transform 120ms ease, opacity 180ms ease;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: var(--bg-surface-muted);
      border-color: var(--border-strong);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================================
       Responsive Adjustments
       ========================================= */
    @media (max-width: 720px) {
      .topbar-inner {
        padding: 10px 14px;
        gap: 10px;
      }

      .para-nav {
        width: 100%;
        justify-content: space-between;
        gap: 4px;
      }

      .para-btn {
        flex: 1;
        padding: 6px 4px 8px;
        font-size: 0.78rem;
      }

      .topbar-controls {
        width: 100%;
        justify-content: space-between;
      }

      .stage {
        padding: 24px 16px 36px;
      }

      .answer-card {
        padding: 20px 22px;
        min-height: 82px;
      }

      .context-card {
        padding: 24px 22px;
        min-height: 180px;
      }

      .nav-btn {
        padding: 11px 18px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- Minimal Top Navigation Bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <nav class="para-nav" id="paraNav" aria-label="Paragraph Navigation"></nav>

      <div class="topbar-controls">
        <div class="q-counter" id="qCounter" aria-live="polite">1 / 32</div>

        <div class="slider-group" title="Adjust text size">
          <span class="slider-label-sm" aria-hidden="true">A</span>
          <input
            type="range"
            id="fontSlider"
            class="font-slider"
            min="0.85"
            max="1.8"
            step="0.05"
            value="1.15"
            aria-label="Text size"
          />
          <span class="slider-label-lg" aria-hidden="true">A</span>
        </div>

        <button
          type="button"
          id="themeToggle"
          class="theme-btn"
          aria-label="Toggle dark mode"
          title="Toggle light/dark mode"
        >
          <!-- Moon icon (shown in light mode) -->
          <svg id="iconMoon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <!-- Sun icon (shown in dark mode) -->
          <svg id="iconSun" viewBox="0 0 24 24" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Single-Question Stage -->
  <main class="stage">
    <div class="stage-inner" id="stageInner">
      <!-- Question Display -->
      <section class="question-block">
        <h1 class="question-text" id="questionText"></h1>
        <button
          type="button"
          class="lang-flag-btn"
          id="questionLangBtn"
          aria-label="Toggle Vietnamese translation for question"
          aria-pressed="false"
        >
          <svg viewBox="0 0 30 20" aria-hidden="true">
            <rect width="30" height="20" fill="#DA251D" />
            <polygon fill="#FFFF00" points="15,4.2 16.45,8.65 21.15,8.65 17.35,11.4 18.8,15.85 15,13.1 11.2,15.85 12.65,11.4 8.85,8.65 13.55,8.65" />
          </svg>
        </button>
      </section>

      <!-- Answer Card -->
      <div
        role="button"
        tabindex="0"
        class="reveal-card answer-card"
        id="answerCard"
        aria-expanded="false"
      >
        <span class="card-cover">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          Answer
        </span>
        <div class="card-content">
          <p class="answer-text" id="answerText"></p>
        </div>
        <button
          type="button"
          class="lang-flag-btn"
          id="answerLangBtn"
          aria-label="Toggle Vietnamese translation for answer"
          aria-pressed="false"
        >
          <svg viewBox="0 0 30 20" aria-hidden="true">
            <rect width="30" height="20" fill="#DA251D" />
            <polygon fill="#FFFF00" points="15,4.2 16.45,8.65 21.15,8.65 17.35,11.4 18.8,15.85 15,13.1 11.2,15.85 12.65,11.4 8.85,8.65 13.55,8.65" />
          </svg>
        </button>
      </div>

      <!-- Larger Story Context Card -->
      <div
        role="button"
        tabindex="0"
        class="reveal-card context-card"
        id="contextCard"
        aria-expanded="false"
      >
        <span class="card-cover">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          Story Context
        </span>
        <div class="card-content">
          <p class="context-text" id="contextText"></p>
        </div>
        <button
          type="button"
          class="lang-flag-btn"
          id="contextLangBtn"
          aria-label="Toggle Vietnamese translation for story context"
          aria-pressed="false"
        >
          <svg viewBox="0 0 30 20" aria-hidden="true">
            <rect width="30" height="20" fill="#DA251D" />
            <polygon fill="#FFFF00" points="15,4.2 16.45,8.65 21.15,8.65 17.35,11.4 18.8,15.85 15,13.1 11.2,15.85 12.65,11.4 8.85,8.65 13.55,8.65" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Subtle Previous / Next Controls -->
    <div class="nav-footer">
      <button type="button" class="nav-btn" id="prevBtn" aria-label="Previous question">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Previous
      </button>

      <button type="button" class="nav-btn" id="nextBtn" aria-label="Next question">
        Next
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </main>

  <script>
    /* =========================================
       Story Paragraphs (8 Paragraphs — A1 EN & VI)

    "q_vi": "Linh đã tạm biệt chú chó Mực như thế nào?",
    "a": "She patted Muc on the head and said goodbye.",
    "a_vi": "Em vỗ nhẹ lên đầu chú chó Mực rồi nói lời tạm biệt.",
    "highlight": "She patted Muc on the head and said goodbye.",
    "highlight_vi": "Em vỗ nhẹ lên đầu chú chó Mực rồi nói lời tạm biệt."
  },
  {
    "p": 7,
    "q": "What did Linh already want to do on the bus?",
    "q_vi": "Trên xe khách, Linh đã muốn làm gì?",
    "a": "She already wanted to visit again.",
    "a_vi": "Em đã muốn quay lại thăm quê lần nữa rồi.",
    "highlight": "She already wanted to visit again.",
    "highlight_vi": "Em đã muốn quay lại thăm quê lần nữa rồi."
  }
];

    /* =========================================
       App State & DOM References
       ========================================= */
    let currentIndex = 0;
    const langState = {
      question: false,
      answer: false,
      context: false
    };

    const paraNav = document.getElementById("paraNav");
    const qCounter = document.getElementById("qCounter");
    const fontSlider = document.getElementById("fontSlider");
    const themeToggle = document.getElementById("themeToggle");
    const iconMoon = document.getElementById("iconMoon");
    const iconSun = document.getElementById("iconSun");

    const stageInner = document.getElementById("stageInner");
    const questionText = document.getElementById("questionText");
    const answerCard = document.getElementById("answerCard");
    const answerText = document.getElementById("answerText");
    const contextCard = document.getElementById("contextCard");
    const contextText = document.getElementById("contextText");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const questionLangBtn = document.getElementById("questionLangBtn");
    const answerLangBtn = document.getElementById("answerLangBtn");
    const contextLangBtn = document.getElementById("contextLangBtn");

    /* =========================================
       Helpers
       ========================================= */
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function buildHighlightedParagraph(paragraph, highlight) {
      const idx = paragraph.indexOf(highlight);
      if (idx === -1) {
        return escapeHTML(paragraph);
      }
      const before = escapeHTML(paragraph.slice(0, idx));
      const match = escapeHTML(paragraph.slice(idx, idx + highlight.length));
      const after = escapeHTML(paragraph.slice(idx + highlight.length));
      return `${before}<mark>${match}</mark>${after}`;
    }

    /* =========================================
       Render Individual Content Slots (EN / VI)
       ========================================= */
    function renderQuestionText() {
      const item = QUESTIONS[currentIndex];
      const isVi = langState.question;
      questionText.textContent = isVi ? item.q_vi : item.q;
      questionText.setAttribute("lang", isVi ? "vi" : "en");
      questionLangBtn.classList.toggle("is-vi", isVi);
      questionLangBtn.setAttribute("aria-pressed", String(isVi));
    }

    function renderAnswerText() {
      const item = QUESTIONS[currentIndex];
      const isVi = langState.answer;
      answerText.textContent = isVi ? item.a_vi : item.a;
      answerText.setAttribute("lang", isVi ? "vi" : "en");
      answerLangBtn.classList.toggle("is-vi", isVi);
      answerLangBtn.setAttribute("aria-pressed", String(isVi));
    }

    function renderContextText() {
      const item = QUESTIONS[currentIndex];
      const isVi = langState.context;
      const paragraph = isVi ? PARAGRAPHS_VI[item.p] : PARAGRAPHS[item.p];
      const highlight = isVi ? item.highlight_vi : item.highlight;
      contextText.innerHTML = buildHighlightedParagraph(paragraph, highlight);
      contextText.setAttribute("lang", isVi ? "vi" : "en");
      contextLangBtn.classList.toggle("is-vi", isVi);
      contextLangBtn.setAttribute("aria-pressed", String(isVi));
    }

    /* =========================================
       Build Paragraph Navigation (P1 - P8)
       ========================================= */
    function initParagraphNav() {
      paraNav.innerHTML = "";
      for (let i = 0; i < 8; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "para-btn";
        btn.dataset.para = i;
        btn.setAttribute("aria-label", `Paragraph ${i + 1}`);

        const label = document.createElement("span");
        label.textContent = `P${i + 1}`;

        const dots = document.createElement("span");
        dots.className = "para-dots";
        dots.setAttribute("aria-hidden", "true");
        for (let d = 0; d < 4; d++) {
          const dot = document.createElement("span");
          dot.className = "para-dot";
          dots.appendChild(dot);
        }

        btn.appendChild(label);
        btn.appendChild(dots);

        btn.addEventListener("click", () => {
          goToQuestion(i * 4);
        });

        paraNav.appendChild(btn);
      }
    }

    function updateParagraphNav() {
      const activePara = QUESTIONS[currentIndex].p;
      const posInPara = currentIndex % 4; // 0, 1, 2, or 3

      const buttons = paraNav.querySelectorAll(".para-btn");
      buttons.forEach((btn, idx) => {
        const isActive = idx === activePara;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-current", isActive ? "true" : "false");

        const dots = btn.querySelectorAll(".para-dot");
        dots.forEach((dot, dIdx) => {
          dot.classList.toggle("filled", isActive && dIdx <= posInPara);
        });
      });
    }

    /* =========================================
       Render Active Question
       ========================================= */
    function resetCards() {
      answerCard.classList.remove("is-revealed");
      answerCard.setAttribute("aria-expanded", "false");
      contextCard.classList.remove("is-revealed");
      contextCard.setAttribute("aria-expanded", "false");

      langState.question = false;
      langState.answer = false;
      langState.context = false;
    }

    function renderQuestion() {
      // Reset cards and language toggles to English
      resetCards();

      // Update text content
      renderQuestionText();
      renderAnswerText();
      renderContextText();

      // Update counter & nav
      qCounter.textContent = `${currentIndex + 1} / ${QUESTIONS.length}`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === QUESTIONS.length - 1;
      updateParagraphNav();

      // Subtle re-trigger of entrance animation
      stageInner.style.animation = "none";
      void stageInner.offsetWidth;
      stageInner.style.animation = "";
    }

    function goToQuestion(index) {
      if (index < 0 || index >= QUESTIONS.length) return;
      currentIndex = index;
      renderQuestion();
    }

    /* =========================================
       Event Listeners
       ========================================= */
    function toggleCard(card) {
      const revealed = card.classList.toggle("is-revealed");
      card.setAttribute("aria-expanded", String(revealed));
    }

    function bindCardReveal(card) {
      card.addEventListener("click", (e) => {
        if (e.target.closest(".lang-flag-btn")) return;
        toggleCard(card);
      });

      card.addEventListener("keydown", (e) => {
        if (e.target !== card) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleCard(card);
        }
      });
    }

    bindCardReveal(answerCard);
    bindCardReveal(contextCard);

    // Discreet Vietnamese Flag Toggles (per card, content only)
    questionLangBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      langState.question = !langState.question;
      renderQuestionText();
    });

    answerLangBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      langState.answer = !langState.answer;
      renderAnswerText();
    });

    contextLangBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      langState.context = !langState.context;
      renderContextText();
    });

    // Previous / Next Buttons
    prevBtn.addEventListener("click", () => goToQuestion(currentIndex - 1));
    nextBtn.addEventListener("click", () => goToQuestion(currentIndex + 1));

    // Keyboard Arrow Navigation
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowRight") {
        goToQuestion(currentIndex + 1);
      } else if (e.key === "ArrowLeft") {
        goToQuestion(currentIndex - 1);
      }
    });

    // Dynamic Font-Size Slider
    fontSlider.addEventListener("input", (e) => {
      document.documentElement.style.setProperty("--text-scale", e.target.value);
    });

    // Light / Dark Mode Toggle
    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const isDark = theme === "dark";
      iconMoon.style.display = isDark ? "none" : "block";
      iconSun.style.display = isDark ? "block" : "none";
      themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      setTheme(current === "dark" ? "light" : "dark");
    });

    // Initialize
    initParagraphNav();
    renderQuestion();
  </script>
</body>
</html>
