name: Z2V Commit Alerts

on:
  push:
    paths:
      - '**/Z2V-*.html'

jobs:
  detect-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed-files.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to accurately detect all changed files in the push

      - name: Get changed Z2V html files
        id: changed-files
        run: |
          # Get added, copied, modified, or renamed Z2V-*.html files as a valid JSON array
          FILES_JSON=$(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.sha }}" -- '**/Z2V-*.html' 'Z2V-*.html' | jq -R -s -c 'split("\n")[:-1]')
          echo "Detected files: $FILES_JSON"
          echo "matrix=$FILES_JSON" >> "$GITHUB_OUTPUT"

  send-emails:
    needs: detect-files
    runs-on: ubuntu-latest
    # Only run if the matrix actually found files
    if: ${{ needs.detect-files.outputs.matrix != '[]' && needs.detect-files.outputs.matrix != '' }}
    strategy:
      matrix:
        file: ${{ fromJSON(needs.detect-files.outputs.matrix) }}
    steps:
      - name: Prepare Email Payload
        id: prep
        run: |
          file="${{ matrix.file }}"
          filename=$(basename "$file")
          name_no_ext="${filename%.*}"
          
          # Force lowercase for the owner to match GitHub Pages standards
          repo_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo_name="${{ github.event.repository.name }}"
          
          # Construct the live GitHub Pages URL (preserves sub-folder paths if applicable)
          gh_pages_url="https://${repo_owner}.github.io/${repo_name}/${file}"
          
          echo "subject=NEW ACTIVITY : $name_no_ext" >> "$GITHUB_OUTPUT"
          echo "gh_pages_url=$gh_pages_url" >> "$GITHUB_OUTPUT"

      - name: Send Email Alert
        uses: dawidd6/action-send-mail@v3
        with:
          # You will need to use your actual SMTP server settings here
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.prep.outputs.subject }}
          to: robert@anvilnexus.com
          # Requires a valid email bracket to prevent Gmail SMTP rejection
          from: Z2V System Alert <${{ secrets.SMTP_USERNAME }}>
          html_body: |
            <br><br><br><br>
            <h2 style="text-align: center;">
              <a href="${{ steps.prep.outputs.gh_pages_url }}">${{ steps.prep.outputs.subject }}</a>
            </h2>
