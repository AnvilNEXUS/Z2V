    // Color-coded pill styling for each Wh-word across Light and Dark modes

      WHAT:  "bg-emerald-50 text-emerald-700 border-emerald-200/80 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/25",

    // Subtle accent tint styling for revealed Answer cards to distinguish them from Question cards
    const WH_ANSWER_CARD_STYLES = {
      WHO:   "bg-blue-50/75 border-blue-200/90 dark:bg-blue-500/[0.11] dark:border-blue-500/30",
      WHAT:  "bg-emerald-50/75 border-emerald-200/90 dark:bg-emerald-500/[0.11] dark:border-emerald-500/30",

    // Application State
    // Questions and Answers start concealed independently by default on every slide
    let currentIndex = 0;
    let revealedQuestions = new Set();
    let revealedAnswers = new Set();
    let isTransitioning = false;

    // Safe localStorage helpers (handles sandboxed iframe environments gracefully)
    function getStoredTheme() {
      try {
        return localStorage.getItem("a2_wh_theme");
      } catch (e) {
        return null;
      }
    }

    function setStoredTheme(theme) {
      try {
        localStorage.setItem("a2_wh_theme", theme);
      } catch (e) {
        // Ignore storage restrictions
      }
    }

    // Apply Light or Dark theme
    function applyTheme(isDark) {
      const root = document.documentElement;
      const sunIcon = document.getElementById("sunIcon");
      const moonIcon = document.getElementById("moonIcon");

      if (isDark) {
        root.classList.add("dark");
        sunIcon.classList.remove("hidden");
        moonIcon.classList.add("hidden");
      } else {
        root.classList.remove("dark");
        sunIcon.classList.add("hidden");
        moonIcon.classList.remove("hidden");
      }
    }

    // Initialize theme on startup
    function initTheme() {
      const saved = getStoredTheme();
      if (saved === "dark") {
        applyTheme(true);
      } else if (saved === "light") {
        applyTheme(false);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(prefersDark);
      }
    }

    // Synchronize the header "Reveal Questions" and "Reveal All" buttons with current reveal state
    function updateHeaderToggleUI() {
      const totalCards = SLIDES[currentIndex].items.length;

      // Update "Reveal Questions" / "Hide Questions" button
      const qBtn = document.getElementById("toggleQuestionsBtn");
      const qEyeOpen = document.getElementById("qEyeOpenIcon");
      const qEyeClosed = document.getElementById("qEyeClosedIcon");
      const qLabel = document.getElementById("toggleQuestionsLabel");
      const allQuestionsRevealed = revealedQuestions.size === totalCards;

      qBtn.setAttribute("aria-pressed", String(allQuestionsRevealed));
      if (allQuestionsRevealed) {
        qEyeOpen.classList.add("hidden");
        qEyeClosed.classList.remove("hidden");
        qLabel.textContent = "Hide Questions";
      } else {
        qEyeOpen.classList.remove("hidden");
        qEyeClosed.classList.add("hidden");
        qLabel.textContent = "Reveal Questions";
      }

      // Update "Reveal All" / "Hide All" button
      const allBtn = document.getElementById("toggleAllBtn");
      const eyeOpen = document.getElementById("eyeOpenIcon");
      const eyeClosed = document.getElementById("eyeClosedIcon");
      const label = document.getElementById("toggleAllLabel");
      const everythingRevealed = allQuestionsRevealed && revealedAnswers.size === totalCards;

      allBtn.setAttribute("aria-pressed", String(everythingRevealed));
      if (everythingRevealed) {
        eyeOpen.classList.add("hidden");
        eyeClosed.classList.remove("hidden");
        label.textContent = "Hide All";
      } else {
        eyeOpen.classList.remove("hidden");
        eyeClosed.classList.add("hidden");
        label.textContent = "Reveal All";
      }
    }

    // Toggle an individual Question card
    function toggleQuestionAtIndex(idx) {
      const wasConcealed = !revealedQuestions.has(idx);
      if (wasConcealed) {
        revealedQuestions.add(idx);
      } else {
        revealedQuestions.delete(idx);
      }
      renderCards(wasConcealed ? { type: "question", idx } : null);
      updateHeaderToggleUI();
    }

    // Toggle an individual Answer card
    function toggleAnswerAtIndex(idx) {
      const wasConcealed = !revealedAnswers.has(idx);
      if (wasConcealed) {
        revealedAnswers.add(idx);
      } else {
        revealedAnswers.delete(idx);
      }
      renderCards(wasConcealed ? { type: "answer", idx } : null);
      updateHeaderToggleUI();
    }

    // Toggle both Question and Answer cards for a specific Wh-word badge
    function togglePairAtIndex(idx) {
      const bothRevealed = revealedQuestions.has(idx) && revealedAnswers.has(idx);
      if (bothRevealed) {
        revealedQuestions.delete(idx);
        revealedAnswers.delete(idx);
        renderCards(null);
      } else {
        revealedQuestions.add(idx);
        revealedAnswers.add(idx);
        renderCards({ type: "both", idx });
      }
      updateHeaderToggleUI();
    }

    // Toggle all 6 Question cards independently of Answer cards
    function toggleAllQuestions() {
      const totalCards = SLIDES[currentIndex].items.length;
      if (revealedQuestions.size === totalCards) {
        revealedQuestions.clear();
      } else {
        for (let i = 0; i < totalCards; i++) {
          revealedQuestions.add(i);
        }
      }
      renderCards(null);
      updateHeaderToggleUI();
    }

    // Toggle all 6 Answer cards independently of Question cards
    function toggleAllAnswers() {
      const totalCards = SLIDES[currentIndex].items.length;
      if (revealedAnswers.size === totalCards) {
        revealedAnswers.clear();
      } else {
        for (let i = 0; i < totalCards; i++) {
          revealedAnswers.add(i);
        }
      }
      renderCards(null);
      updateHeaderToggleUI();
    }

    // Render current slide metadata, sentence, progress, and navigation states
    function renderSlide(direction = 0) {
      const slide = SLIDES[currentIndex];
      const total = SLIDES.length;
      const stage = document.getElementById("slideStage");

      const updateContent = () => {
        document.getElementById("categoryBadge").textContent = slide.category;
        document.getElementById("pageCounter").textContent = `${currentIndex + 1} / ${total}`;
        document.getElementById("sentenceText").textContent = slide.sentence;

        // Update thin top progress bar
        const pct = ((currentIndex + 1) / total) * 100;
        document.getElementById("progressBar").style.width = `${pct}%`;

        // Update Prev / Next buttons
        document.getElementById("prevBtn").disabled = currentIndex === 0;
        document.getElementById("nextBtn").disabled = currentIndex === total - 1;

        renderCards(null);
        updateHeaderToggleUI();
      };

      // Subtle fade/slide transition when navigating between slides
      if (direction !== 0 && !isTransitioning) {
        isTransitioning = true;
        const offsetOut = direction > 0 ? "-10px" : "10px";
        const offsetIn = direction > 0 ? "10px" : "-10px";

        stage.style.opacity = "0";
        stage.style.transform = `translateX(${offsetOut})`;

        setTimeout(() => {
          updateContent();
          stage.style.transition = "none";
          stage.style.transform = `translateX(${offsetIn})`;

          // Force reflow
          void stage.offsetWidth;

          stage.style.transition = "opacity 220ms ease-out, transform 220ms ease-out";
          stage.style.opacity = "1";
          stage.style.transform = "translateX(0)";

          setTimeout(() => {
            isTransitioning = false;
          }, 220);
        }, 140);
      } else {
        updateContent();
      }
    }

    // Navigation handlers (reset all Question and Answer cards to concealed on slide change)
    function goToPrev() {
      if (currentIndex > 0) {
        currentIndex -= 1;
        revealedQuestions.clear();
        revealedAnswers.clear();
        renderSlide(-1);
      }
    }

    function goToNext() {
      if (currentIndex < SLIDES.length - 1) {
        currentIndex += 1;
        revealedQuestions.clear();
        revealedAnswers.clear();
        renderSlide(1);
      }
    }

    // Bind UI Event Listeners
    document.getElementById("prevBtn").addEventListener("click", goToPrev);
    document.getElementById("nextBtn").addEventListener("click", goToNext);

    // Header "Reveal Questions" / "Hide Questions" button
    document.getElementById("toggleQuestionsBtn").addEventListener("click", toggleAllQuestions);

    // Header "Reveal All" / "Hide All" button
    document.getElementById("toggleAllBtn").addEventListener("click", () => {
      const totalCards = SLIDES[currentIndex].items.length;
      const everythingRevealed =
        revealedQuestions.size === totalCards && revealedAnswers.size === totalCards;

      if (everythingRevealed) {
        revealedQuestions.clear();
        revealedAnswers.clear();
      } else {
        for (let i = 0; i < totalCards; i++) {
          revealedQuestions.add(i);
          revealedAnswers.add(i);
        }
      }
      renderCards(null);
      updateHeaderToggleUI();
    });

    // Theme toggle button
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const isCurrentlyDark = document.documentElement.classList.contains("dark");
      const nextIsDark = !isCurrentlyDark;
      applyTheme(nextIsDark);
      setStoredTheme(nextIsDark ? "dark" : "light");
    });

    // Keyboard Navigation: ArrowLeft, ArrowRight, Space, Q (Questions), A (Answers), and 1-6 (Pairs)
    document.addEventListener("keydown", (e) => {
      const activeTag = document.activeElement ? document.activeElement.tagName : "";
      const isInteractiveFocused = activeTag === "BUTTON" || document.activeElement?.getAttribute("role") === "button";
      const hasModifier = e.ctrlKey || e.metaKey || e.altKey;

      if (e.key === "ArrowLeft") {
        e.preventDefault();
        goToPrev();
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        goToNext();
      } else if (e.key === " " && !isInteractiveFocused) {
        e.preventDefault();
        if (e.shiftKey) {
          goToPrev();
        } else {
          goToNext();
        }
      } else if (!hasModifier && (e.key === "q" || e.key === "Q")) {
        e.preventDefault();
        toggleAllQuestions();
      } else if (!hasModifier && (e.key === "a" || e.key === "A")) {
        e.preventDefault();
        toggleAllAnswers();
      } else if (!hasModifier && e.key >= "1" && e.key <= "6") {
        const cardIdx = parseInt(e.key, 10) - 1;
        if (cardIdx < SLIDES[currentIndex].items.length) {
          e.preventDefault();
          togglePairAtIndex(cardIdx);
        }
      }
    });

    // Touch Swipe Support for Mobile & Tablet
    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;

        // Trigger slide change only on clear horizontal swipes
        if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
          if (deltaX < 0) {
            goToNext();
          } else {
            goToPrev();
          }
        }
      }
    }, { passive: true });

    // Bootstrap App
    initTheme();
    renderSlide(0);
  </script>
</body>
</html>
