<!DOCTYPE html>
<html lang="en" class="antialiased dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wh-Question Rally — A2 EFL Classroom Stage</title>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .font-display {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-pop {
      animation: popIn 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseRing {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }

    .animate-spin-highlight {
      animation: pulseRing 160ms ease-in-out infinite;
    }

    /* Custom subtle scrollbars for slide picker modal */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(161, 161, 170, 0.3);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#FAF9F6] text-[#18181B] dark:bg-[#0B0D13] dark:text-[#F4F4F6] transition-colors duration-300 min-h-[100dvh] flex flex-col justify-between overflow-x-hidden">

  <!-- Top Progress Line -->
  <div class="fixed top-0 left-0 right-0 h-1 bg-zinc-200/70 dark:bg-zinc-800/80 z-50 pointer-events-none">
    <div id="progressBar" class="h-full bg-indigo-600 dark:bg-indigo-400 transition-all duration-300 ease-out" style="width: 4.16%;"></div>
  </div>

  <!-- Main Classroom Viewport Container -->
  <div class="w-full max-w-[1440px] mx-auto px-4 sm:px-8 lg:px-12 py-3 sm:py-5 flex-1 flex flex-col justify-between gap-4">

    <!-- TOP CONTROL BAR (Zero Clutter, Classroom Tools) -->
    <header class="flex flex-wrap items-center justify-between gap-3 pt-1 shrink-0">
      <!-- Left: Slide Selector Trigger & Category Pill -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button
          id="slidePickerBtn"
          type="button"
          title="Jump to any sentence"
          class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm sm:text-base font-bold bg-white dark:bg-[#151924] text-zinc-800 dark:text-zinc-100 border border-zinc-200/90 dark:border-zinc-800 hover:border-indigo-500/50 dark:hover:border-indigo-400/50 shadow-xs active:scale-95 transition-all cursor-pointer"
        >
          <span id="pageCounter" class="tabular-nums">1 / 24</span>
          <span class="text-zinc-300 dark:text-zinc-700">•</span>
          <span id="categoryBadge" class="text-indigo-600 dark:text-indigo-400 truncate max-w-[160px] sm:max-w-none">Travel &amp; Transport</span>
          <svg class="w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- View Mode Switcher: Spotlight (1-by-1) vs Board (6 Tiles) -->
        <div class="inline-flex p-1 rounded-xl bg-zinc-200/70 dark:bg-[#151924] border border-zinc-300/60 dark:border-zinc-800">
          <button
            id="modeSpotlightBtn"
            type="button"
            class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all cursor-pointer bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-xs"
          >
            Spotlight
          </button>
          <button
            id="modeBoardBtn"
            type="button"
            class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all cursor-pointer text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white"
          >
            6-Tile Board
          </button>
        </div>
      </div>

      <!-- Center: Optional 2-Team Scoreboard for Rally Gamification -->
      <div class="flex items-center gap-2 bg-white dark:bg-[#151924] border border-zinc-200/90 dark:border-zinc-800 rounded-xl px-2.5 py-1 shadow-xs">
        <!-- Team A -->
        <div class="flex items-center gap-1.5">
          <span class="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-sky-600 dark:text-sky-400 px-1">Team A</span>
          <button type="button" onclick="adjustScore('A', -1)" class="w-6 h-6 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-xs font-bold flex items-center justify-center cursor-pointer">−</button>
          <span id="scoreA" class="min-w-[24px] text-center text-base sm:text-lg font-extrabold tabular-nums">0</span>
          <button type="button" onclick="adjustScore('A', 1)" class="w-6 h-6 rounded-lg bg-sky-500/15 text-sky-600 dark:text-sky-300 hover:bg-sky-500/25 text-xs font-bold flex items-center justify-center cursor-pointer">+</button>
        </div>
        <span class="text-zinc-300 dark:text-zinc-700 font-bold">|</span>
        <!-- Team B -->
        <div class="flex items-center gap-1.5">
          <span class="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-amber-600 dark:text-amber-400 px-1">Team B</span>
          <button type="button" onclick="adjustScore('B', -1)" class="w-6 h-6 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-xs font-bold flex items-center justify-center cursor-pointer">−</button>
          <span id="scoreB" class="min-w-[24px] text-center text-base sm:text-lg font-extrabold tabular-nums">0</span>
          <button type="button" onclick="adjustScore('B', 1)" class="w-6 h-6 rounded-lg bg-amber-500/15 text-amber-600 dark:text-amber-300 hover:bg-amber-500/25 text-xs font-bold flex items-center justify-center cursor-pointer">+</button>
        </div>
      </div>

      <!-- Right: Random Spinner, Blur Sentence, & Theme Toggle -->
      <div class="flex items-center gap-2">
        <!-- Random Wh-Spinner Button -->
        <button
          id="randomWhBtn"
          type="button"
          title="Spin a random Wh-word (Shortcut: R)"
          class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm active:scale-95 transition-all cursor-pointer"
        >
          <span>🎲</span>
          <span>Random Wh</span>
        </button>

        <!-- Memory Blur Toggle (Hide/Show Target Sentence for Answerer) -->
        <button
          id="blurSentenceBtn"
          type="button"
          title="Blur sentence for memory challenge (Shortcut: B)"
          class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-[#151924] text-zinc-700 dark:text-zinc-200 border border-zinc-200/90 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800 active:scale-95 transition-all cursor-pointer"
        >
          <svg class="w-4 h-4 text-zinc-500 dark:text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
          <span id="blurSentenceLabel" class="hidden sm:inline">Memory Blur</span>
        </button>

        <!-- Theme Toggle -->
        <button
          id="themeToggleBtn"
          type="button"
          aria-label="Toggle Light/Dark Mode"
          class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-white dark:bg-[#151924] text-zinc-700 dark:text-zinc-200 border border-zinc-200/90 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800 active:scale-95 transition-all cursor-pointer"
        >
          <svg id="sunIcon" class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
          <svg id="moonIcon" class="w-5 h-5 text-zinc-600 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- CENTER STAGE: MASSIVE SENTENCE + WH-DOCK + INTERACTIVE DISPLAY -->
    <main id="slideStage" class="flex-1 flex flex-col justify-center gap-5 sm:gap-7 my-auto transition-all duration-200">

      <!-- 1. HIGH-IMPACT SENTENCE BANNER (Readable from back of classroom) -->
      <section
        id="sentenceBanner"
        onclick="toggleSentenceBlur()"
        title="Click or press B to toggle memory blur"
        class="relative rounded-3xl bg-white dark:bg-[#131722] border-2 border-zinc-200/90 dark:border-zinc-800/90 px-6 sm:px-10 lg:px-14 py-6 sm:py-9 shadow-sm text-center cursor-pointer transition-all duration-300 group"
      >
        <h1
          id="sentenceText"
          class="font-display text-2xl sm:text-4xl lg:text-[46px] font-extrabold tracking-tight leading-[1.22] text-zinc-900 dark:text-white transition-all duration-300 select-text"
        >
          My father flew to Hanoi by plane last week for a business trip.
        </h1>
        <!-- Overlay shown when Sentence is Blurred for Memory Challenge -->
        <div
          id="sentenceBlurOverlay"
          class="hidden absolute inset-0 rounded-3xl bg-zinc-900/10 dark:bg-black/40 backdrop-blur-md flex items-center justify-center"
        >
          <span class="px-5 py-2.5 rounded-2xl bg-zinc-900/90 dark:bg-white/95 text-white dark:text-zinc-900 text-lg sm:text-xl font-extrabold tracking-wide shadow-lg">
            👀 Memory Mode — Click or press B to show sentence
          </span>
        </div>
      </section>

      <!-- 2. SLEEK 6-BUTTON WH-WORD SELECTOR DOCK -->
      <section aria-label="Question Word Selector" class="grid grid-cols-3 sm:grid-cols-6 gap-2.5 sm:gap-3.5">
        <!-- Dynamically populated Wh-buttons (WHO, WHAT, WHERE, WHEN, WHY, HOW) -->
        <div id="whDock" class="contents"></div>
      </section>

      <!-- 3A. SPOTLIGHT RALLY STAGE (Default Mode: Giant 1-by-1 Progressive Q&A) -->
      <section id="spotlightContainer" class="w-full">
        <div
          id="spotlightCard"
          class="rounded-3xl bg-white dark:bg-[#131722] border-2 border-zinc-200/90 dark:border-zinc-800/90 p-5 sm:p-8 lg:p-10 min-h-[250px] sm:min-h-[290px] flex flex-col justify-between gap-6 shadow-sm transition-all duration-200"
        >
          <!-- Dynamically populated by renderSpotlight() -->
        </div>
      </section>

      <!-- 3B. 6-TILE BOARD MODE (Optional All-at-Once Clean Large Grid, Zero Filler Text) -->
      <section id="boardContainer" class="hidden w-full">
        <div class="flex items-center justify-end gap-2 mb-3">
          <button
            type="button"
            onclick="boardRevealAllQuestions()"
            class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-[#151924] border border-zinc-200 dark:border-zinc-800 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer"
          >
            Toggle All ?
          </button>
          <button
            type="button"
            onclick="boardRevealAllBoth()"
            class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-[#151924] border border-zinc-200 dark:border-zinc-800 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer"
          >
            Toggle All ? + !
          </button>
        </div>
        <div id="boardGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <!-- Dynamically populated by renderBoard() -->
        </div>
      </section>

    </main>

    <!-- BOTTOM NAVIGATION & SHORTCUT LEGEND -->
    <footer class="flex flex-wrap items-center justify-between gap-4 pt-1 pb-1 shrink-0">
      <button
        id="prevBtn"
        type="button"
        class="inline-flex items-center gap-2.5 px-5 py-3 rounded-2xl text-sm sm:text-base font-bold bg-white dark:bg-[#151924] text-zinc-800 dark:text-zinc-100 border border-zinc-200/90 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800 disabled:opacity-35 disabled:pointer-events-none active:scale-95 transition-all cursor-pointer shadow-xs"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
        <span>Previous</span>
      </button>

      <!-- Minimalist Teacher Keyboard Legend -->
      <div class="hidden xl:flex items-center gap-4 text-xs font-semibold text-zinc-400 dark:text-zinc-500">
        <span><kbd class="px-1.5 py-0.5 rounded bg-zinc-200/70 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">1–6</kbd> Pick Wh-Word</span>
        <span><kbd class="px-1.5 py-0.5 rounded bg-zinc-200/70 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">Space</kbd> Reveal Next Step</span>
        <span><kbd class="px-1.5 py-0.5 rounded bg-zinc-200/70 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">R</kbd> Random Spin</span>
        <span><kbd class="px-1.5 py-0.5 rounded bg-zinc-200/70 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">B</kbd> Memory Blur</span>
        <span><kbd class="px-1.5 py-0.5 rounded bg-zinc-200/70 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">← / →</kbd> Slide</span>
      </div>

      <button
        id="nextBtn"
        type="button"
        class="inline-flex items-center gap-2.5 px-5 py-3 rounded-2xl text-sm sm:text-base font-bold bg-indigo-600 hover:bg-indigo-500 text-white disabled:opacity-35 disabled:pointer-events-none active:scale-95 transition-all cursor-pointer shadow-xs"
      >
        <span>Next Sentence</span>
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </button>
    </footer>

  </div>

  <!-- SLIDE PICKER MODAL (Jump to any of the 24 sentences) -->
  <div
    id="slidePickerModal"
    class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-xs flex items-center justify-center p-4"
  >
    <div class="bg-white dark:bg-[#151924] border border-zinc-200 dark:border-zinc-800 rounded-3xl max-w-4xl w-full max-h-[82vh] flex flex-col shadow-2xl overflow-hidden animate-pop">
      <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-200 dark:border-zinc-800">
        <h2 class="text-lg sm:text-xl font-extrabold">Jump to Sentence (1–24)</h2>
        <button
          id="closeModalBtn"
          type="button"
          class="w-9 h-9 rounded-xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 flex items-center justify-center font-bold cursor-pointer"
        >
          ✕
        </button>
      </div>
      <div id="slideListContainer" class="p-4 sm:p-6 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <script>
    /**
     * Complete 24-Sentence Dataset for A2 EFL Wh-Question Practice
     */
    const SLIDES = [
      {
        category: "Travel & Transport",
        sentence: "My father flew to Hanoi by plane last week for a business trip.",
        items: [
          { wh: "WHO", question: "Who flew to Hanoi?", answer: "My father." },
          { wh: "WHAT", question: "What did he do?", answer: "He flew to Hanoi." },
          { wh: "WHERE", question: "Where did he fly?", answer: "To Hanoi." },
          { wh: "WHEN", question: "When did he fly to Hanoi?", answer: "Last week." },
          { wh: "WHY", question: "Why did he fly to Hanoi?", answer: "For a business trip." },
          { wh: "HOW", question: "How did he fly to Hanoi?", answer: "By plane." }
        ]
      },
      {
        category: "Travel & Transport",
        sentence: "Sarah traveled to Da Nang by train yesterday morning to visit her grandparents.",
        items: [
          { wh: "WHO", question: "Who traveled to Da Nang?", answer: "Sarah." },
          { wh: "WHAT", question: "What did she do?", answer: "She traveled to Da Nang." },
          { wh: "WHERE", question: "Where did she travel?", answer: "To Da Nang." },
          { wh: "WHEN", question: "When did she travel to Da Nang?", answer: "Yesterday morning." },
          { wh: "WHY", question: "Why did she travel to Da Nang?", answer: "To visit her grandparents." },
          { wh: "HOW", question: "How did she travel to Da Nang?", answer: "By train." }
        ]
      },
      {
        category: "Travel & Transport",
        sentence: "Our class went to the history museum by school bus on Friday to learn about ancient kings.",
        items: [
          { wh: "WHO", question: "Who went to the history museum?", answer: "Our class." },
          { wh: "WHAT", question: "What did the class do?", answer: "They went to the history museum." },
          { wh: "WHERE", question: "Where did they go?", answer: "To the history museum." },
          { wh: "WHEN", question: "When did they go to the history museum?", answer: "On Friday." },
          { wh: "WHY", question: "Why did they go to the history museum?", answer: "To learn about ancient kings." },
          { wh: "HOW", question: "How did they go to the history museum?", answer: "By school bus." }
        ]
      },
      {
        category: "Travel & Transport",
        sentence: "Tom rode his bicycle to the beach at 6:00 AM to watch the sunrise.",
        items: [
          { wh: "WHO", question: "Who rode his bicycle to the beach?", answer: "Tom." },
          { wh: "WHAT", question: "What did he ride?", answer: "His bicycle." },
          { wh: "WHERE", question: "Where did he ride his bicycle?", answer: "To the beach." },
          { wh: "WHEN", question: "When did he ride to the beach?", answer: "At 6:00 AM." },
          { wh: "WHY", question: "Why did he go to the beach?", answer: "To watch the sunrise." },
          { wh: "HOW", question: "How did he go to the beach?", answer: "By bicycle (he rode his bicycle)." }
        ]
      },
      {
        category: "Travel & Transport",
        sentence: "My aunt drove to the airport in her new car last night to pick up my cousin.",
        items: [
          { wh: "WHO", question: "Who drove to the airport?", answer: "My aunt." },
          { wh: "WHAT", question: "What did she do?", answer: "She drove to the airport." },
          { wh: "WHERE", question: "Where did she drive?", answer: "To the airport." },
          { wh: "WHEN", question: "When did she drive to the airport?", answer: "Last night." },
          { wh: "WHY", question: "Why did she drive to the airport?", answer: "To pick up my cousin." },
          { wh: "HOW", question: "How did she go to the airport?", answer: "In her new car." }
        ]
      },
      {
        category: "Travel & Transport",
        sentence: "The tourists walked to the old temple on foot this morning to take photos.",
        items: [
          { wh: "WHO", question: "Who walked to the old temple?", answer: "The tourists." },
          { wh: "WHAT", question: "What did they do?", answer: "They walked to the old temple." },
          { wh: "WHERE", question: "Where did they walk?", answer: "To the old temple." },
          { wh: "WHEN", question: "When did they walk to the old temple?", answer: "This morning." },
          { wh: "WHY", question: "Why did they walk to the old temple?", answer: "To take photos." },
          { wh: "HOW", question: "How did they go to the old temple?", answer: "On foot." }
        ]
      },
      {
        category: "Shopping & Food",
        sentence: "My mother bought fresh vegetables at the local market with cash this morning to make soup.",
        items: [
          { wh: "WHO", question: "Who bought fresh vegetables?", answer: "My mother." },
          { wh: "WHAT", question: "What did she buy?", answer: "Fresh vegetables." },
          { wh: "WHERE", question: "Where did she buy fresh vegetables?", answer: "At the local market." },
          { wh: "WHEN", question: "When did she buy them?", answer: "This morning." },
          { wh: "WHY", question: "Why did she buy fresh vegetables?", answer: "To make soup." },
          { wh: "HOW", question: "How did she pay for them?", answer: "With cash." }
        ]
      },
      {
        category: "Shopping & Food",
        sentence: "David ordered a large pizza from the Italian restaurant on his phone at 8:00 PM because he was hungry.",
        items: [
          { wh: "WHO", question: "Who ordered a large pizza?", answer: "David." },
          { wh: "WHAT", question: "What did he order?", answer: "A large pizza." },
          { wh: "WHERE", question: "Where did he order it from?", answer: "From the Italian restaurant." },
          { wh: "WHEN", question: "When did he order it?", answer: "At 8:00 PM." },
          { wh: "WHY", question: "Why did he order a pizza?", answer: "Because he was hungry." },
          { wh: "HOW", question: "How did he order it?", answer: "On his phone." }
        ]
      },
      {
        category: "Shopping & Food",
        sentence: "Lisa baked a chocolate cake in the kitchen yesterday using a simple recipe for her brother's birthday.",
        items: [
          { wh: "WHO", question: "Who baked a chocolate cake?", answer: "Lisa." },
          { wh: "WHAT", question: "What did she bake?", answer: "A chocolate cake." },
          { wh: "WHERE", question: "Where did she bake it?", answer: "In the kitchen." },
          { wh: "WHEN", question: "When did she bake it?", answer: "Yesterday." },
          { wh: "WHY", question: "Why did she bake a cake?", answer: "For her brother's birthday." },
          { wh: "HOW", question: "How did she bake it?", answer: "Using a simple recipe." }
        ]
      },
      {
        category: "Shopping & Food",
        sentence: "My brother bought a blue jacket at the shopping mall with his credit card on Saturday for his winter holiday.",

    /**
     * Application State
     * - viewMode: 'spotlight' (1-by-1 large rally) | 'board' (6-tile clean grid)
     * - activeWhIndex: null or 0..5 (selected Wh-word in Spotlight mode)
     * - spotlightStep: 0 (Wh-prompt only) -> 1 (Question revealed) -> 2 (Question + Answer revealed)
     * - completedWh: Set of indices (0..5) completed on the current slide
     * - boardRevealedQ / boardRevealedA: Sets for 6-Tile Board mode
     */
    let currentIndex = 0;
    let viewMode = "spotlight";
    let activeWhIndex = null;
    let spotlightStep = 0;
    let completedWh = new Set();
    let boardRevealedQ = new Set();
    let boardRevealedA = new Set();
    let isSentenceBlurred = false;
    let isSpinning = false;
    let scores = { A: 0, B: 0 };

    // Team Scoreboard Helper
    function adjustScore(team, delta) {
      scores[team] = Math.max(0, scores[team] + delta);
      document.getElementById(`score${team}`).textContent = scores[team];
    }

    // Sentence Blur Toggle for Memory Challenge
    function toggleSentenceBlur(forceState = null) {
      isSentenceBlurred = forceState !== null ? forceState : !isSentenceBlurred;
      const overlay = document.getElementById("sentenceBlurOverlay");
      const textEl = document.getElementById("sentenceText");
      const btn = document.getElementById("blurSentenceBtn");

      if (isSentenceBlurred) {
        overlay.classList.remove("hidden");
        textEl.classList.add("blur-md", "opacity-25");
        btn.classList.add("ring-2", "ring-indigo-500");
      } else {
        overlay.classList.add("hidden");
        textEl.classList.remove("blur-md", "opacity-25");
        btn.classList.remove("ring-2", "ring-indigo-500");
      }
    }

    // Select a Wh-Word in Spotlight Mode (or toggle in Board Mode)
    function selectWhWord(idx) {
      if (isSpinning) return;

      if (viewMode === "board") {
        // In Board Mode, clicking a dock button toggles both Question & Answer for that tile
        const bothShown = boardRevealedQ.has(idx) && boardRevealedA.has(idx);
        if (bothShown) {
          boardRevealedQ.delete(idx);
          boardRevealedA.delete(idx);
          completedWh.delete(idx);
        } else {
          boardRevealedQ.add(idx);
          boardRevealedA.add(idx);
          completedWh.add(idx);
        }
        renderWhDock();
        renderBoard();
        return;
      }

      // In Spotlight Mode:
      // If clicking the already-active Wh-word, advance the reveal step (0 -> 1 -> 2 -> 0)
      if (activeWhIndex === idx) {
        advanceSpotlightStep();
      } else {
        activeWhIndex = idx;
        spotlightStep = 0; // Start at Step 0: Giant Wh-word prompt for Student A to form the question
        renderWhDock();
        renderSpotlight();
      }
    }

    // Advance Spotlight Step: Step 0 (Prompt) -> Step 1 (Question) -> Step 2 (Answer)
    function advanceSpotlightStep() {
      if (activeWhIndex === null) {
        // If no Wh-word is selected yet, pick the first uncompleted one
        for (let i = 0; i < 6; i++) {
          if (!completedWh.has(i)) {
            activeWhIndex = i;
            spotlightStep = 0;
            renderWhDock();
            renderSpotlight();
            return;
          }
        }
        activeWhIndex = 0;
        spotlightStep = 0;
        renderWhDock();
        renderSpotlight();
        return;
      }

      if (spotlightStep === 0) {
        spotlightStep = 1;
      } else if (spotlightStep === 1) {
        spotlightStep = 2;
        completedWh.add(activeWhIndex);
      } else {
        // If already at Step 2, toggle back to concealed (Step 0) so teacher can re-test if desired
        spotlightStep = 0;
      }
      renderWhDock();
      renderSpotlight();
    }

    // Direct toggle for Question or Answer slot inside Spotlight Card
    function toggleSpotlightSlot(slotType) {
      if (activeWhIndex === null) return;
      if (slotType === "question") {
        spotlightStep = spotlightStep >= 1 ? 0 : 1;
      } else if (slotType === "answer") {
        if (spotlightStep === 2) {
          spotlightStep = 1;
        } else {
          spotlightStep = 2;
          completedWh.add(activeWhIndex);
        }
      }
      renderWhDock();
      renderSpotlight();
    }

    // Random Wh-Word Game Spinner
    function spinRandomWh() {
      if (isSpinning) return;
      if (viewMode !== "spotlight") {
        setViewMode("spotlight");
      }

      const slide = SLIDES[currentIndex];
      // Prefer uncompleted Wh-words; if all 6 are completed, reset and choose from all 6
      let candidates = [0, 1, 2, 3, 4, 5].filter((i) => !completedWh.has(i));
      if (candidates.length === 0) {
        completedWh.clear();
        candidates = [0, 1, 2, 3, 4, 5];
      }

      isSpinning = true;
      let ticks = 0;
      const totalTicks = 10;
      const interval = setInterval(() => {
        const previewIdx = candidates[ticks % candidates.length];
        activeWhIndex = previewIdx;
        spotlightStep = 0;
        renderWhDock(previewIdx);
        ticks++;

        if (ticks >= totalTicks) {
          clearInterval(interval);
          const finalIdx = candidates[Math.floor(Math.random() * candidates.length)];
          activeWhIndex = finalIdx;
          spotlightStep = 0;
          isSpinning = false;
          renderWhDock();
          renderSpotlight();
        }
      }, 65);
    }

    // Render the 6-Button Wh-Word Selector Dock
    function renderWhDock(spinHighlightIdx = null) {
      const slide = SLIDES[currentIndex];
      const dock = document.getElementById("whDock");
      dock.innerHTML = "";

      slide.items.forEach((item, idx) => {
        const theme = WH_THEMES[item.wh];
        const isActive = viewMode === "spotlight" && activeWhIndex === idx;
        const isDone = completedWh.has(idx);
        const isSpinTarget = spinHighlightIdx === idx;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.onclick = () => selectWhWord(idx);
        btn.className = [
          "relative rounded-2xl px-4 py-3.5 sm:py-4 border-2 font-display font-extrabold tracking-wider transition-all duration-150 cursor-pointer flex items-center justify-between gap-2",
          isActive ? theme.activeDock : theme.idleDock,
          isSpinTarget ? "animate-spin-highlight" : "active:scale-95"
        ].join(" ");

        // Left: Shortcut number badge + Wh-Word
        const leftWrap = document.createElement("div");
        leftWrap.className = "flex items-center gap-2.5";

        const numBadge = document.createElement("span");
        numBadge.className = [
          "w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center",
          isActive
            ? "bg-black/20 text-white"
            : "bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400"
        ].join(" ");
        numBadge.textContent = idx + 1;

        const wordSpan = document.createElement("span");
        wordSpan.className = "text-lg sm:text-2xl tracking-tight";
        wordSpan.textContent = item.wh;

        leftWrap.appendChild(numBadge);
        leftWrap.appendChild(wordSpan);
        btn.appendChild(leftWrap);

        // Right: Subtle Checkmark if completed
        if (isDone) {
          const checkBadge = document.createElement("span");
          checkBadge.className = [
            "w-6 h-6 rounded-full text-xs font-extrabold flex items-center justify-center",
            isActive
              ? "bg-white text-zinc-900"
              : "bg-emerald-500/20 text-emerald-600 dark:text-emerald-400"
          ].join(" ");
          checkBadge.textContent = "✓";
          btn.appendChild(checkBadge);
        }

        dock.appendChild(btn);
      });
    }

    // Render Spotlight Mode (Large 1-by-1 Progressive Q&A Stage)
    function renderSpotlight() {
      const container = document.getElementById("spotlightCard");
      const slide = SLIDES[currentIndex];

      // State A: No Wh-word chosen yet on this slide
      if (activeWhIndex === null) {
        container.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-center py-8 gap-4">
            <div class="inline-flex items-center gap-3 px-5 py-2.5 rounded-2xl bg-zinc-100 dark:bg-zinc-800/90 text-zinc-500 dark:text-zinc-400 text-base sm:text-lg font-bold">

            </div>
          </div>
        `;
        return;
      }

      const item = slide.items[activeWhIndex];
      const theme = WH_THEMES[item.wh];
      const showQuestion = spotlightStep >= 1;
      const showAnswer = spotlightStep >= 2;

      container.innerHTML = "";

      // Top Header Row inside Spotlight: Huge Wh-Prompt Badge + Step Indicator
      const topBar = document.createElement("div");

      const whPromptPill = document.createElement("div");

      whPromptPill.textContent = `${item.wh} ... ?`;

      const nextActionBtn = document.createElement("button");
      nextActionBtn.type = "button";
      nextActionBtn.onclick = () => advanceSpotlightStep();
      nextActionBtn.className = "px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-600 dark:text-zinc-300 transition-colors cursor-pointer";
      nextActionBtn.textContent =
        spotlightStep === 0
          ? "Space → Show ?"
          : spotlightStep === 1
          ? "Space → Show !"
          : "Space → Reset";

      topBar.appendChild(whPromptPill);
      topBar.appendChild(nextActionBtn);
      container.appendChild(topBar);

      // Two Interactive Giant Slots: Question (?) on Left/Top, Answer (!) on Right/Bottom
      const slotsGrid = document.createElement("div");

        `;
      } else {
        aSlot.innerHTML = `
          <div class="w-full flex items-center justify-center gap-3 text-zinc-400 dark:text-zinc-500">
            <span class="font-display text-5xl sm:text-6xl font-extrabold opacity-60">!</span>
          </div>
        `;
      }

      slotsGrid.appendChild(qSlot);
      slotsGrid.appendChild(aSlot);
      container.appendChild(slotsGrid);
    }

    // Render 6-Tile Board Mode (Zero redundant text, large classroom tiles)
    function renderBoard() {
      const slide = SLIDES[currentIndex];
      const grid = document.getElementById("boardGrid");
      grid.innerHTML = "";

      slide.items.forEach((item, idx) => {
        const theme = WH_THEMES[item.wh];
        const qShown = boardRevealedQ.has(idx);
        const aShown = boardRevealedA.has(idx);

        const rowCard = document.createElement("div");
        rowCard.className = "rounded-2xl bg-white dark:bg-[#131722] border-2 border-zinc-200/90 dark:border-zinc-800/90 p-3.5 sm:p-4 flex flex-col gap-3 shadow-xs";

        // Grid inside each tile: Wh-Badge | Question (?) | Answer (!)
        const innerGrid = document.createElement("div");
        innerGrid.className = "grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-stretch";

        // Question Button (7 cols)
        const qBtn = document.createElement("button");
        qBtn.type = "button";
        qBtn.onclick = () => {
          if (boardRevealedQ.has(idx)) {
            boardRevealedQ.delete(idx);
          } else {
            boardRevealedQ.add(idx);
          }
          renderBoard();
        };
        qBtn.className = [
          "sm:col-span-7 rounded-xl p-3.5 sm:p-4 text-left transition-all cursor-pointer flex items-center gap-3 min-h-[78px]",
          qShown
            ? "bg-zinc-50 dark:bg-[#1A2030] border border-zinc-300 dark:border-zinc-700"
            : "bg-zinc-100/60 dark:bg-[#171C29] border border-dashed border-zinc-300 dark:border-zinc-700 hover:border-zinc-400"
        ].join(" ");

        qBtn.innerHTML = `
          <span class="px-2.5 py-1 rounded-lg text-xs sm:text-sm font-extrabold border shrink-0 ${theme.pill}">${item.wh}</span>
          ${
            qShown
              ? `<span class="text-lg sm:text-xl lg:text-2xl font-bold text-zinc-900 dark:text-white leading-snug animate-pop">${item.question}</span>`
              : `<span class="text-2xl font-extrabold text-zinc-400 dark:text-zinc-600 ml-auto mr-auto">?</span>`
          }
        `;

        // Answer Button (5 cols)
        const aBtn = document.createElement("button");
        aBtn.type = "button";
        aBtn.onclick = () => {
          if (boardRevealedA.has(idx)) {
            boardRevealedA.delete(idx);
          } else {
            boardRevealedA.add(idx);
            completedWh.add(idx);
          }
          renderWhDock();
          renderBoard();
        };
        aBtn.className = [
          "sm:col-span-5 rounded-xl p-3.5 sm:p-4 text-left transition-all cursor-pointer flex items-center justify-center min-h-[78px]",
          aShown
            ? `${theme.answerCard} border shadow-xs`
            : "bg-zinc-100/60 dark:bg-[#171C29] border border-dashed border-zinc-300 dark:border-zinc-700 hover:border-zinc-400"
        ].join(" ");

        aBtn.innerHTML = aShown
          ? `<span class="text-lg sm:text-xl lg:text-2xl font-extrabold leading-snug text-center animate-pop">${item.answer}</span>`
          : `<span class="text-2xl font-extrabold text-zinc-400 dark:text-zinc-600">!</span>`;

        innerGrid.appendChild(qBtn);
        innerGrid.appendChild(aBtn);
        rowCard.appendChild(innerGrid);
        grid.appendChild(rowCard);
      });
    }

    // Board Mode Bulk Helpers
    function boardRevealAllQuestions() {
      if (boardRevealedQ.size === 6) {
        boardRevealedQ.clear();
      } else {
        for (let i = 0; i < 6; i++) boardRevealedQ.add(i);
      }
      renderBoard();
    }

    function boardRevealAllBoth() {
      if (boardRevealedQ.size === 6 && boardRevealedA.size === 6) {
        boardRevealedQ.clear();
        boardRevealedA.clear();
      } else {
        for (let i = 0; i < 6; i++) {
          boardRevealedQ.add(i);
          boardRevealedA.add(i);
          completedWh.add(i);
        }
      }
      renderWhDock();
      renderBoard();
    }

    // Switch between Spotlight Mode and 6-Tile Board Mode
    function setViewMode(mode) {
      viewMode = mode;
      const spotlightBtn = document.getElementById("modeSpotlightBtn");
      const boardBtn = document.getElementById("modeBoardBtn");
      const spotlightContainer = document.getElementById("spotlightContainer");
      const boardContainer = document.getElementById("boardContainer");

      if (mode === "spotlight") {
        spotlightContainer.classList.remove("hidden");
        boardContainer.classList.add("hidden");
        spotlightBtn.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all cursor-pointer bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-xs";
        boardBtn.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all cursor-pointer text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white";
      } else {
        spotlightContainer.classList.add("hidden");
        boardContainer.classList.remove("hidden");
        boardBtn.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all cursor-pointer bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-xs";
        spotlightBtn.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all cursor-pointer text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white";
      }

      renderWhDock();
      renderSpotlight();
      renderBoard();
    }

    // Render full slide state
    function renderSlide() {
      const slide = SLIDES[currentIndex];
      const total = SLIDES.length;

      document.getElementById("pageCounter").textContent = `${currentIndex + 1} / ${total}`;
      document.getElementById("categoryBadge").textContent = slide.category;
      document.getElementById("sentenceText").textContent = slide.sentence;
      document.getElementById("progressBar").style.width = `${((currentIndex + 1) / total) * 100}%`;

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").disabled = currentIndex === total - 1;

      toggleSentenceBlur(false);
      renderWhDock();
      renderSpotlight();
      renderBoard();
    }

    function resetSlideProgress() {
      activeWhIndex = null;
      spotlightStep = 0;
      completedWh.clear();
      boardRevealedQ.clear();
      boardRevealedA.clear();
    }

    function goToSlide(index) {
      if (index >= 0 && index < SLIDES.length) {
        currentIndex = index;
        resetSlideProgress();
        renderSlide();
      }
    }

    function goToPrev() {
      if (currentIndex > 0) {
        goToSlide(currentIndex - 1);
      }
    }

    function goToNext() {
      if (currentIndex < SLIDES.length - 1) {
        goToSlide(currentIndex + 1);
      }
    }

    // Slide Picker Modal Population
    function openSlidePicker() {
      const modal = document.getElementById("slidePickerModal");
      const list = document.getElementById("slideListContainer");
      list.innerHTML = "";

      SLIDES.forEach((s, idx) => {
        const itemBtn = document.createElement("button");
        itemBtn.type = "button";
        const isCurrent = idx === currentIndex;
        itemBtn.className = [
          "p-3.5 rounded-2xl text-left border transition-all cursor-pointer flex flex-col gap-1",
          isCurrent
            ? "bg-indigo-600/10 border-indigo-500 text-indigo-600 dark:text-indigo-300"
            : "bg-zinc-50 dark:bg-zinc-800/50 border-zinc-200 dark:border-zinc-800 hover:border-zinc-400"
        ].join(" ");

        itemBtn.innerHTML = `
          <div class="flex items-center justify-between text-xs font-extrabold uppercase tracking-wider text-zinc-400">
            <span>#${idx + 1} • ${s.category}</span>
            ${isCurrent ? `<span class="text-indigo-500">Current</span>` : ""}
          </div>
          <p class="text-sm sm:text-base font-bold text-zinc-800 dark:text-zinc-100 line-clamp-2">${s.sentence}</p>
        `;
        itemBtn.onclick = () => {
          goToSlide(idx);
          closeSlidePicker();
        };
        list.appendChild(itemBtn);
      });

      modal.classList.remove("hidden");
    }

    function closeSlidePicker() {
      document.getElementById("slidePickerModal").classList.add("hidden");
    }

    // Theme Setup
    function toggleTheme() {
      const root = document.documentElement;
      const isDark = root.classList.toggle("dark");
      document.getElementById("sunIcon").classList.toggle("hidden", !isDark);
      document.getElementById("moonIcon").classList.toggle("hidden", isDark);
    }

    // Bind Controls
    document.getElementById("prevBtn").addEventListener("click", goToPrev);
    document.getElementById("nextBtn").addEventListener("click", goToNext);
    document.getElementById("randomWhBtn").addEventListener("click", spinRandomWh);
    document.getElementById("blurSentenceBtn").addEventListener("click", () => toggleSentenceBlur());
    document.getElementById("themeToggleBtn").addEventListener("click", toggleTheme);
    document.getElementById("modeSpotlightBtn").addEventListener("click", () => setViewMode("spotlight"));
    document.getElementById("modeBoardBtn").addEventListener("click", () => setViewMode("board"));
    document.getElementById("slidePickerBtn").addEventListener("click", openSlidePicker);
    document.getElementById("closeModalBtn").addEventListener("click", closeSlidePicker);
    document.getElementById("slidePickerModal").addEventListener("click", (e) => {
      if (e.target.id === "slidePickerModal") closeSlidePicker();
    });

    // Classroom Keyboard Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      // Close modal on Escape
      if (e.key === "Escape") {
        closeSlidePicker();
        return;
      }

      if (e.key === "ArrowLeft") {
        e.preventDefault();
        goToPrev();
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        goToNext();
      } else if (e.key >= "1" && e.key <= "6") {
        e.preventDefault();
        selectWhWord(parseInt(e.key, 10) - 1);
      } else if (e.key === " " || e.key === "ArrowDown" || e.key === "Enter") {
        // Space or Down advances the current Spotlight Q&A reveal step
        if (viewMode === "spotlight") {
          e.preventDefault();
          advanceSpotlightStep();
        }
      } else if (e.key === "r" || e.key === "R") {
        e.preventDefault();
        spinRandomWh();
      } else if (e.key === "b" || e.key === "B") {
        e.preventDefault();
        toggleSentenceBlur();
      }
    });

    // Initialize Presentation
    renderSlide();
  </script>
</body>
</html>
