  <style>
    :root {
      --text-scale: 1;
    }

    /* Custom Parchment & Dark Theme Palette Variables */
    body.light-theme {
      background-color: #FAF6EE;
      color: #1C232B;
    }
    body.dark-theme {
      background-color: #0E1218;
      color: #F3F6FA;
    }

    .card-theme {
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    body.light-theme .card-theme {
      background-color: #FFFFFF;
      border-color: #E5DCC8;
      box-shadow: 0 10px 25px -5px rgba(28, 35, 43, 0.05), 0 8px 10px -6px rgba(28, 35, 43, 0.03);
    }
    body.dark-theme .card-theme {
      background-color: #171D27;
      border-color: #293242;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .border-theme {
      transition: border-color 0.25s ease;
    }
    body.light-theme .border-theme {
      border-color: #E5DCC8;
    }
    body.dark-theme .border-theme {
      border-color: #293242;
    }

    .muted-text {
      transition: color 0.25s ease;
    }
    body.light-theme .muted-text {
      color: #766E62;
    }
    body.dark-theme .muted-text {
      color: #8B9BB4;
    }

    /* Scaling typography for projector legibility */
    .statement-text {
      font-size: calc(clamp(1.75rem, 3.8vw, 3.4rem) * var(--text-scale));
      line-height: 1.25;
    }

    .question-text {
      font-size: calc(clamp(1.75rem, 3.8vw, 3.4rem) * var(--text-scale));
      line-height: 1.25;
    }

    /* Clue highlight style */
    mark.clue-highlight {
      background-color: rgba(251, 191, 36, 0.35);
      color: inherit;
      border-bottom: 3px solid #f59e0b;
      border-radius: 0.25rem;
      padding: 0.05em 0.25em;
      transition: all 0.2s ease;
    }
    body.dark-theme mark.clue-highlight {
      background-color: rgba(245, 158, 11, 0.25);
      color: #fef08a;
      border-bottom-color: #fbbf24;
    }

    /* Wh-word specific colors */
    .badge-WHO { background-color: rgba(37, 99, 235, 0.12); color: #1d4ed8; border-color: rgba(37, 99, 235, 0.3); }

    body.dark-theme .badge-WHAT { background-color: rgba(16, 185, 129, 0.25); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.4); }

    body.dark-theme .badge-WHERE { background-color: rgba(245, 158, 11, 0.25); color: #fde047; border-color: rgba(251, 191, 36, 0.4); }

    .badge-WHEN { background-color: rgba(147, 51, 234, 0.12); color: #7e22ce; border-color: rgba(147, 51, 234, 0.3); }
    body.dark-theme .badge-WHEN { background-color: rgba(147, 51, 234, 0.25); color: #d8b4fe; border-color: rgba(192, 132, 252, 0.4); }

    .badge-WHY { background-color: rgba(225, 29, 72, 0.12); color: #be123c; border-color: rgba(225, 29, 72, 0.3); }
    body.dark-theme .badge-WHY { background-color: rgba(225, 29, 72, 0.25); color: #fda4af; border-color: rgba(251, 113, 133, 0.4); }

    .badge-HOW { background-color: rgba(13, 148, 136, 0.12); color: #0f766e; border-color: rgba(13, 148, 136, 0.3); }

    .ctrl-btn {
      transition: all 0.15s ease;
      user-select: none;
    }
    body.light-theme .ctrl-btn {
      background-color: #FFFFFF;
      border-color: #E5DCC8;
      color: #1C232B;
    }

    .no-select {

        <p id="questionDisplay" class="question-text font-extrabold tracking-tight">
          Loading question...
        </p>
      </div>
    </div>

  </main>

    ];

    // -------------------------------------------------------------
    // STATE MANAGEMENT
    // -------------------------------------------------------------
    let currentDeck = [...ALL_PROMPTS];
    let currentIndex = 0;
    let isRevealed = false;
    let isClueEnabled = false;
    let isShuffleEnabled = false;
    let isDarkMode = false;
    let textScale = 1.0;

    // Elements
    const tenseSelect = document.getElementById('tenseSelect');
    const cardCounter = document.getElementById('cardCounter');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnClue = document.getElementById('btnClue');
    const btnFontDown = document.getElementById('btnFontDown');
    const btnFontUp = document.getElementById('btnFontUp');
    const btnTheme = document.getElementById('btnTheme');
    const iconSun = document.getElementById('iconSun');
    const iconMoon = document.getElementById('iconMoon');

    const tenseBadge = document.getElementById('tenseBadge');
    const promptIdTag = document.getElementById('promptIdTag');
    const statementDisplay = document.getElementById('statementDisplay');

    const questionCard = document.getElementById('questionCard');
    const whBadge = document.getElementById('whBadge');
    const concealedState = document.getElementById('concealedState');
    const revealedState = document.getElementById('revealedState');
    const questionDisplay = document.getElementById('questionDisplay');

    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    // Helper: HTML Escaping
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Helper: Fisher-Yates Shuffle
    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Initialize Theme
    function initTheme() {
      const savedTheme = localStorage.getItem('wh_deck_theme');
      if (savedTheme === 'dark') {
        isDarkMode = true;
      } else {
        isDarkMode = false;
      }
      applyTheme();
    }

    function applyTheme() {
      if (isDarkMode) {
        document.body.classList.remove('light-theme');
        document.body.classList.add('dark-theme');
        document.documentElement.classList.add('dark');
        iconSun.classList.remove('hidden');
        iconMoon.classList.add('hidden');
      } else {
        document.body.classList.remove('dark-theme');
        document.body.classList.add('light-theme');
        document.documentElement.classList.remove('dark');
        iconSun.classList.add('hidden');
        iconMoon.classList.remove('hidden');
      }
    }

    function toggleTheme() {
      isDarkMode = !isDarkMode;
      try {
        localStorage.setItem('wh_deck_theme', isDarkMode ? 'dark' : 'light');
      } catch (e) {}
      applyTheme();
    }

    // Update Filter & Active Deck
    function updateDeckFilter() {
      const selectedTense = tenseSelect.value;
      let filtered = selectedTense === "ALL" 
        ? [...ALL_PROMPTS] 
        : ALL_PROMPTS.filter(item => item.tense === selectedTense);

      if (isShuffleEnabled) {
        filtered = shuffleArray(filtered);
      }

      currentDeck = filtered;
      currentIndex = 0;
      isRevealed = false;
      renderCard();
    }

    // Render Current Card
    function renderCard() {
      if (!currentDeck || currentDeck.length === 0) return;

      const item = currentDeck[currentIndex];

      // Update Tense & ID
      tenseBadge.textContent = item.tense.toUpperCase();
      promptIdTag.textContent = `#${item.id}`;

      // Update Statement (with Clue Highlighting if enabled)
      if (isClueEnabled && item.clue) {
        statementDisplay.innerHTML = getHighlightedStatement(item.statement, item.clue);
      } else {
        statementDisplay.textContent = item.statement;
      }

      // Update Wh-word Badge
      whBadge.textContent = item.wh;
      // Reset Badge Classes
      whBadge.className = `px-3.5 py-1 rounded-full text-sm font-extrabold tracking-wider border shadow-sm transition-all uppercase badge-${item.wh}`;

      // Update Question Display (Highlight the leading Wh-word)
      const formattedQuestion = formatQuestionText(item.question, item.wh);
      questionDisplay.innerHTML = formattedQuestion;

      // Update Concealed / Revealed state UI
      if (isRevealed) {
        concealedState.classList.add('hidden');
        revealedState.classList.remove('hidden');
      } else {
        concealedState.classList.remove('hidden');
        revealedState.classList.add('hidden');
      }

      // Update Counter
      cardCounter.textContent = `${currentIndex + 1} / ${currentDeck.length}`;
    }

    // Format Clue Highlighting inside Statement
    function getHighlightedStatement(statement, clue) {
      const lowerStmt = statement.toLowerCase();
      const lowerClue = clue.toLowerCase();
      const idx = lowerStmt.indexOf(lowerClue);

      if (idx === -1) return escapeHTML(statement);

      const originalSub = statement.substring(idx, idx + clue.length);
      const before = escapeHTML(statement.substring(0, idx));
      const match = escapeHTML(originalSub);
      const after = escapeHTML(statement.substring(idx + clue.length));

      return `${before}<mark class="clue-highlight">${match}</mark>${after}`;
    }

    // Format Question Text
    function formatQuestionText(question, wh) {
      const safeQ = escapeHTML(question);
      if (safeQ.startsWith(wh)) {
        return `<span class="font-black text-blue-600 dark:text-blue-400">${wh}</span>${safeQ.slice(wh.length)}`;
      }
      return safeQ;
    }

    // Toggle Conceal / Reveal State
    function toggleReveal() {
      isRevealed = !isRevealed;
      renderCard();
    }

    // Navigation Controls
    function nextCard() {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex + 1) % currentDeck.length;
      isRevealed = false;
      renderCard();
    }

    function prevCard() {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
      isRevealed = false;
      renderCard();
    }

    // Font Scale Controls
    function setFontScale(newScale) {
      textScale = Math.min(Math.max(newScale, 0.8), 1.45);
      document.documentElement.style.setProperty('--text-scale', textScale);
    }

    // -------------------------------------------------------------
    // EVENT LISTENERS & SHORTCUTS
    // -------------------------------------------------------------
    tenseSelect.addEventListener('change', updateDeckFilter);

    btnShuffle.addEventListener('click', () => {
      isShuffleEnabled = !isShuffleEnabled;
      btnShuffle.classList.toggle('active', isShuffleEnabled);
      updateDeckFilter();
    });

    btnClue.addEventListener('click', () => {
      isClueEnabled = !isClueEnabled;
      btnClue.classList.toggle('active', isClueEnabled);
      renderCard();
    });

    btnFontDown.addEventListener('click', () => setFontScale(textScale - 0.1));
    btnFontUp.addEventListener('click', () => setFontScale(textScale + 0.1));
    btnTheme.addEventListener('click', toggleTheme);

    questionCard.addEventListener('click', toggleReveal);
    btnNext.addEventListener('click', nextCard);
    btnPrev.addEventListener('click', prevCard);

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      // Ignore key events when interacting with select dropdown
      if (document.activeElement === tenseSelect && (e.key === ' ' || e.key === 'Enter')) {
        return;
      }

      if (e.key === 'ArrowRight') {
        nextCard();
      } else if (e.key === 'ArrowLeft') {
        prevCard();
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        toggleReveal();
      } else if (e.key === 'c' || e.key === 'C') {
        isClueEnabled = !isClueEnabled;
        btnClue.classList.toggle('active', isClueEnabled);
        renderCard();
      } else if (e.key === 'd' || e.key === 'D') {
        toggleTheme();
      }
    });

    // Initial Load
    window.onload = function() {
      initTheme();
      updateDeckFilter();
    };
  </script>
